name: Final Soltec slope consistency 20260911

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: [.github/workflows/tmp-final-copy-consistency-20260911.yml]

permissions:
  contents: write

jobs:
  consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply source-backed slope corrections only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              return s.replace(old,new,1)

          p=Path('carport-soltec/index.html')
          s=p.read_text(encoding='utf-8')
          s=one(s,
              '<p class="k-copy"><strong>SL 170 je pre jedno auto.</strong> <strong>SL 240 je pre dve autá.</strong> Oba používajú 30 mm ISO panel; spád môže byť podľa zostavy skrytý alebo priznaný a voda odchádza v stĺpoch. Box, boky, osvetlenie a zásuvka v stĺpe sú doplnky.</p>',
              '<p class="k-copy"><strong>SL 170 je pre jedno auto.</strong> <strong>SL 240 je pre dve autá.</strong> Oba používajú 30 mm ISO panel s viditeľným 1,5 % spádom; voda odchádza integrovaným odvodnením v stĺpoch. Box, boky, osvetlenie a zásuvka v stĺpe sú doplnky.</p>',
              'carport model intro')
          s=one(s,
              '<div><span>Spád</span><strong>skrytý alebo priznaný</strong></div>',
              '<div><span>Spád</span><strong>viditeľný 1,5 %</strong></div>',
              'carport system slope')
          s=one(s,
              'Strechu radu SL tvorí 3 cm ISO panel so spádom smerom k odvodneniu. Podľa konkrétnej zostavy môže byť spád skrytý alebo priznaný; presnú skladbu potvrdíme pri návrhu.',
              'Strechu radu SL tvorí 3 cm ISO panel s viditeľným 1,5 % spádom smerom k integrovanému odvodneniu. Presnú skladbu a odtoky potvrdíme pri návrhu.',
              'carport material slope paragraph')
          s=one(s,
              '<p class="kh-mat__pojem">Spád</p><p class="kh-mat__hodnota">skrytý / priznaný</p>',
              '<p class="kh-mat__pojem">Spád</p><p class="kh-mat__hodnota">viditeľný 1,5 %</p>',
              'carport material slope fact')
          s=one(s,
              'Celohliníkový rám a nerezové spojovacie prvky, vyrobené v EÚ. Voda odteká v stĺpoch, takže na prístrešku nie sú viditeľné odkvapy, a strecha z ISO panela má spád skrytý v ráme. Pod tou istou strechou môže stáť uzamykateľný box.',
              'Celohliníkový rám a nerezové spojovacie prvky, vyrobené v EÚ. Voda odteká v stĺpoch, takže na prístrešku nie sú viditeľné odkvapy; ISO panel radu SL má viditeľný 1,5 % spád. Pod tou istou strechou môže stáť uzamykateľný box.',
              'carport feature slope paragraph')
          s=one(s,
              '<details class="kh-faq__item k-rise"><summary><span>Aký je rozdiel medzi F a SL?</span><span class="kh-faq__sign" aria-hidden="true"></span></summary><div><p>F má spád skrytý vnútri vodorovného rámu, takže konštrukcia pôsobí rovno. SL má spád priznaný — strecha viditeľne klesá k jednej strane a stĺpy sú rôzne vysoké.</p></div></details>',
              '<details class="kh-faq__item k-rise"><summary><span>Aký je rozdiel medzi F a SL?</span><span class="kh-faq__sign" aria-hidden="true"></span></summary><div><p>F má 2 % spád ISO panela integrovaný do vodorovného rámu, takže horná línia pôsobí rovno. SL má viditeľný 1,5 % spád ISO panela — strecha klesá k odvodneniu.</p></div></details>',
              'carport FAQ F-vs-SL')
          p.write_text(s,encoding='utf-8')

          p=Path('pevne-prestresenia/index.html')
          s=p.read_text(encoding='utf-8')
          s=one(s,
              '<p class="kh-mat__text">Zvonku pôsobí vodorovne, voda odchádza stĺpom. Rady F aj SL sa dajú urobiť aj s priznaným spádom.</p><div class="kh-mat__pata"><div class="kh-mat__udaj"><p class="kh-mat__pojem">Spád</p><p class="kh-mat__hodnota">skrytý v ráme</p></div><div class="kh-mat__udaj"><p class="kh-mat__pojem">Odvod</p><p class="kh-mat__hodnota">stĺpom</p></div></div>',
              '<p class="kh-mat__text">Pri rade F je 2 % spád ISO panela integrovaný do vodorovného rámu, takže horná línia pôsobí rovno. Voda odchádza integrovaným odvodnením cez stĺpy.</p><div class="kh-mat__pata"><div class="kh-mat__udaj"><p class="kh-mat__pojem">Spád F</p><p class="kh-mat__hodnota">integrovaný 2 %</p></div><div class="kh-mat__udaj"><p class="kh-mat__pojem">Odvod</p><p class="kh-mat__hodnota">stĺpom</p></div></div>',
              'fixed canopy F slope')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' carport-soltec/index.html pevne-prestresenia/index.html)"
          test "$changed" = "$expected"

      - name: Static consistency checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          car=Path('carport-soltec/index.html').read_text(encoding='utf-8')
          can=Path('pevne-prestresenia/index.html').read_text(encoding='utf-8')
          required_car=['viditeľným 1,5 % spádom','viditeľný 1,5 %','F má 2 % spád ISO panela integrovaný do vodorovného rámu']
          for x in required_car:
              if x not in car: raise SystemExit('missing carport source-backed fact: '+x)
          forbidden_car=['spád môže byť podľa zostavy skrytý alebo priznaný','skrytý / priznaný','strecha z ISO panela má spád skrytý v ráme']
          for x in forbidden_car:
              if x in car: raise SystemExit('stale contradictory carport claim remains: '+x)
          if 'Rady F aj SL sa dajú urobiť aj s priznaným spádom' in can:
              raise SystemExit('unsupported F/SL slope claim remains on canopy page')
          for x in ['Pri rade F je 2 % spád ISO panela integrovaný do vodorovného rámu','integrovaný 2 %']:
              if x not in can: raise SystemExit('missing canopy F slope fact: '+x)
          print('Slope consistency PASS: F = integrated 2%; carport SL = visible 1.5%')
          PY

      - name: Browser smoke desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8912 >/tmp/slope-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8912/carport-soltec/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/slope-pw
          cd /tmp/slope-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/slope-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu']});
          for(const vp of [{width:1440,height:1000,name:'desktop'},{width:390,height:844,name:'mobile'}]){
            for(const [route,must] of [['/carport-soltec/',['viditeľný 1,5 %','2 % spád ISO panela']],['/pevne-prestresenia/',['integrovaný 2 %']]]){
              const c=await b.newContext({viewport:{width:vp.width,height:vp.height}}); const p=await c.newPage(); const errs=[];p.on('pageerror',e=>errs.push(String(e)));
              await p.goto('http://127.0.0.1:8912'+route,{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(500);
              const text=(await p.locator('body').innerText()).replace(/\s+/g,' ');
              for(const x of must) if(!text.includes(x)) throw new Error(route+' missing '+x);
              const ov=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(ov>2) throw new Error(route+' '+vp.name+' overflow '+ov);
              if(errs.length) throw new Error(route+' '+errs.join(' | ')); await c.close();
            }
          } await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carport-soltec/index.html pevne-prestresenia/index.html
          git commit -m 'fix: align Soltec slope copy with catalogue'
          git rm .github/workflows/tmp-final-copy-consistency-20260911.yml
          git commit -m 'ci: remove temporary slope consistency workflow'
          git push origin HEAD:fix/koverta-final-repair-20260910
