name: Historical content recovery audit

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-content-recovery-20260910.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover historical sections and current regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def show(sha, path):
              try:
                  return subprocess.check_output(['git','show',f'{sha}:{path}'], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  return ''

          def section_around(text, needle, span=1100):
              i=text.find(needle)
              if i<0: return None
              return text[max(0,i-span):min(len(text),i+span)]

          print('=== CURRENT HEAD ===')
          print(subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())

          print('\n=== HISTORICAL MONTÁŽ A ODOVZDANIE CANDIDATES ===')
          current = Path('index.html').read_text(encoding='utf-8')
          current_media = section_around(current, 'Montáž a odovzdanie', 900) or ''
          print('CURRENT:', re.findall(r'<img[^>]+src="([^"]+)"', current_media))
          seen=[]
          for sha in subprocess.check_output(['git','rev-list','--all','--','index.html'], text=True).splitlines():
              txt=show(sha,'index.html')
              if 'Montáž a odovzdanie' not in txt: continue
              sec=section_around(txt,'Montáž a odovzdanie',900) or ''
              imgs=tuple(re.findall(r'<img[^>]+src="([^"]+)"',sec))
              if imgs and imgs not in seen:
                  seen.append(imgs)
                  msg=subprocess.check_output(['git','show','-s','--format=%s',sha], text=True).strip()
                  print(sha[:12], msg, '=>', imgs)
                  if len(seen)>=8: break

          print('\n=== CURRENT PROCESS ===')
          m=re.search(r'<!-- ={20,}\s*07 · PROCES.*?</section>', current, re.S)
          if m:
              proc=m.group(0)
              for n,t in re.findall(r'<em>(\d+)</em><strong>(.*?)</strong>',proc,re.S):
                  print(n, re.sub('<.*?>','',t))
              print('images=', re.findall(r'<img[^>]+src="([^"]+)"',proc))

          print('\n=== CURRENT STANDALONE K-LINK CTA BY PAGE ===')
          for p in ['pristresky-pre-auta/index.html','zahradne-pristresky/index.html','carport-soltec/index.html','bioklimaticke-pergoly/index.html','pevne-prestresenia/index.html','tienenie/index.html','outdoor-kuchyne/index.html']:
              txt=Path(p).read_text(encoding='utf-8')
              vals=[]
              for mm in re.finditer(r'<a class="k-link"[^>]*>(.*?)</a>',txt,re.S):
                  label=re.sub(r'<[^>]+>',' ',mm.group(1))
                  label=' '.join(label.split())
                  vals.append(label)
              print(p, vals)

          print('\n=== CURRENT PHOTO DUPLICATES IN MAIN (EXCLUDING REALIZACIE-LIKE SECTIONS HEURISTIC) ===')
          for p in ['index.html','pristresky-pre-auta/index.html','zahradne-pristresky/index.html','carport-soltec/index.html','bioklimaticke-pergoly/index.html','pevne-prestresenia/index.html','tienenie/index.html','outdoor-kuchyne/index.html']:
              txt=Path(p).read_text(encoding='utf-8')
              main=txt[txt.find('<main'):txt.rfind('</main>')]
              # strip obvious gallery/realisations sections before counting
              main=re.sub(r'<section[^>]*(?:id="realizacie"|aria-labelledby="galTitle")[^>]*>.*?</section>','',main,flags=re.S)
              imgs=re.findall(r'<img[^>]+src="([^"?#]+\.(?:jpg|jpeg|png|webp))',main,re.I)
              d={x:imgs.count(x) for x in set(imgs) if imgs.count(x)>1}
              print(p, sorted(d.items(), key=lambda kv:(-kv[1],kv[0])))

          print('\n=== CURRENT HERO + BREADCRUMB ===')
          for p in ['pristresky-pre-auta/index.html','zahradne-pristresky/index.html','carport-soltec/index.html','bioklimaticke-pergoly/index.html','pevne-prestresenia/index.html','tienenie/index.html','outdoor-kuchyne/index.html']:
              txt=Path(p).read_text(encoding='utf-8')
              hero=re.search(r'<section class="kh-hero".*?</section>',txt,re.S)
              if not hero: continue
              h=hero.group(0)
              img=re.search(r'<img[^>]+src="([^"]+)"',h)
              h1=re.search(r'<h1[^>]*>(.*?)</h1>',h,re.S)
              crumb=re.search(r'<nav class="kh-crumbs.*?</nav>',h,re.S)
              clean=lambda s:' '.join(re.sub(r'<[^>]+>',' ',s or '').split())
              print(p,'hero=',img.group(1) if img else None,'h1=',clean(h1.group(1) if h1 else ''),'crumb=',clean(crumb.group(0) if crumb else ''))

          print('\n=== HEADER STICKY JS STATUS ===')
          js=Path('assets/koverta-2026.js').read_text(encoding='utf-8')
          print('je-plava=', 'je-plava' in js, 'je-schovana=', 'je-schovana' in js, 'initHeader=', 'function initHeader' in js)

          print('\n=== SPECIFIC TEXT CHECKS ===')
          for p in ['pristresky-pre-auta/index.html','zahradne-pristresky/index.html','carport-soltec/index.html','bioklimaticke-pergoly/index.html','pevne-prestresenia/index.html']:
              txt=Path(p).read_text(encoding='utf-8')
              for needle in ['Konštrukcia, ktorá nepotrebuje náter','Terasa použiteľná aj keď prší','Rozdiel vidíte v jednej tabuľke','Osem vecí','Skladba konštrukcie']:
                  if needle in txt: print(p, 'HAS', needle)
          PY