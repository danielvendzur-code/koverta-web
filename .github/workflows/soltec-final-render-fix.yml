name: Soltec final renderer fix

on:
  push:
    branches: [fix/soltec-louver-stability-20260910]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soltec-louver-stability-20260910
          fetch-depth: 0
      - name: Apply renderer correction
        run: python3 .github/scripts/apply-soltec-final-render-fix.py
      - name: Syntax
        run: |
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/test/soltec-motion-regression.js
          node --check konfigurator/test/soltec-all-models-regression.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8901 >/tmp/soltec-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=bio' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soltec-http.log
          exit 1
      - name: Bioclimatic motion regression
        env:
          SOLTEC_URL: http://127.0.0.1:8901/konfigurator/?page=bio
        run: node konfigurator/test/soltec-motion-regression.js
      - name: All Soltec models regression
        env:
          SOLTEC_BASE_URL: http://127.0.0.1:8901/konfigurator/
        run: node konfigurator/test/soltec-all-models-regression.js
      - name: Commit verified renderer only
        run: |
          git config user.name 'danielvendzur-code'
          git config user.email 'daniel.vendzur@gmail.com'
          git rm .github/scripts/apply-soltec-final-render-fix.py .github/workflows/soltec-final-render-fix.yml
          git add konfigurator/soltec-premium.js konfigurator/test/soltec-motion-regression.js konfigurator/test/soltec-all-models-regression.js
          git commit -m 'fix: stabilize Soltec renderer from every angle'
          git push origin HEAD:fix/soltec-louver-stability-20260910
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soltec-final-render-evidence
          path: qa-artifacts
          if-no-files-found: ignore
