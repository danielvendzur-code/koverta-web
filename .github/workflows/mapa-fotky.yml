name: Fotky realizácií na mapu
on:
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: ['.github/mapa-fotky/fotky.json']
permissions:
  contents: write
jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 .github/mapa-fotky/spracuj.py
      - name: Ulož do vetvy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mapa
          git commit -m "Fotky realizácií na mapu (1280 px, bez EXIF)"
          for i in 1 2 3; do git pull --rebase -q origin claude/practical-dijkstra-d9d0nt && git push -q origin HEAD:claude/practical-dijkstra-d9d0nt && break; sleep 5; done
