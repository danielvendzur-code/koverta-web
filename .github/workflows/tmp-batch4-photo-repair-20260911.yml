name: Batch 4 garden catalog photo repair

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch4-photo-repair-20260911.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace failed garden catalog image with verified Koverta product image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p=Path('zahradne-pristresky/index.html')
          s=p.read_text(encoding='utf-8')
          old='<img referrerpolicy="no-referrer" src="https://lh3.googleusercontent.com/d/16lFqgg210JPCsKm3Ik2i508xmnUPkT5s=w1600" alt="Záhradný prístrešok Koverta nad terasou" loading="lazy" decoding="async">'
          new='<img src="https://cdn.shopify.com/s/files/1/0268/6356/6930/products/d22ad50cd9088af2c3aa7b55fcdd30bd.jpeg?v=1788763545385" alt="Záhradný prístrešok Koverta 3 × 3 m nad terasou" loading="lazy" decoding="async">'
          if s.count(old)!=1:
              raise SystemExit(f'expected one failed catalog image, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if changed != ['zahradne-pristresky/index.html']:
              raise SystemExit(f'unexpected scope: {changed}')
          PY
          git diff --check

      - name: Browser QA image load and screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8905 >/tmp/koverta-b4-photo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          mkdir -p /tmp/koverta-b4-photo-pw qa-batch4-photo
          cd /tmp/koverta-b4-photo-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/koverta-b4-photo-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > /tmp/koverta-b4-photo-pw/check.js <<'JS'
          const { chromium } = require('playwright');
          const path=require('path');
          const p=require('node:process');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:p.env.CHROME,args:['--no-sandbox','--disable-gpu']});
            for(const vp of [{width:1440,height:1000,name:'desktop'},{width:390,height:844,name:'mobile'}]){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              const page=await ctx.newPage();
              const failures=[];
              page.on('requestfailed',r=>{ if(r.resourceType()==='image') failures.push(r.url()); });
              await page.goto('http://127.0.0.1:8905/zahradne-pristresky/#rozTitle',{waitUntil:'networkidle',timeout:60000});
              const sec=page.locator('section:has(#rozTitle)');
              await sec.scrollIntoViewIfNeeded();
              await page.waitForTimeout(700);
              const img=sec.locator('#roz-zahrada .kh-size__media img');
              const state=await img.evaluate(el=>({complete:el.complete,naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,src:el.currentSrc||el.src}));
              if(!state.complete || state.naturalWidth<100 || state.naturalHeight<100) throw new Error('catalog image failed: '+JSON.stringify(state));
              if(!state.src.includes('cdn.shopify.com/s/files/1/0268/6356/6930/products/d22ad50cd9088af2c3aa7b55fcdd30bd.jpeg')) throw new Error('unexpected catalog source '+state.src);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>2) throw new Error('horizontal overflow '+overflow);
              if(failures.some(u=>u.includes('16lFqgg210JPCsKm3Ik2i508xmnUPkT5s'))) throw new Error('old failed Google image still requested');
              await sec.screenshot({path:path.join(p.env.GITHUB_WORKSPACE,'qa-batch4-photo','garden-catalog-photo-'+vp.name+'.png')});
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);p.exit(1)});
          JS
          node /tmp/koverta-b4-photo-pw/check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch4-garden-photo-${{ github.sha }}
          path: qa-batch4-photo/*.png
          if-no-files-found: error

      - name: Commit repair and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zahradne-pristresky/index.html
          test "$(git diff --cached --name-only)" = "zahradne-pristresky/index.html"
          git commit -m 'fix: repair garden catalog photo source'
          git rm .github/workflows/tmp-batch4-photo-repair-20260911.yml
          git commit -m 'ci: remove temporary garden photo QA workflow'
          git push origin HEAD:fix/koverta-final-repair-20260910
