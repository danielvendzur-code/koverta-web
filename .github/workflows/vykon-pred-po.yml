name: Výkon webu pred a po
on:
  push:
    branches: [fix/vykon-pred-po-20261001]
    paths:
      - 'assets/**'
      - '**/*.html'
      - 'tools/css-stranky.js'
      - 'tools/pridaj-realizacie.py'
      - '.github/workflows/vykon-pred-po.yml'
      - 'tools/meraj-pagespeed.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zostavit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.hotovo.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vygenerovať a skontrolovať zdroje
        run: |
          set -euo pipefail
          npm install --no-save postcss@8.5.28 terser@5.51.2
          node tools/zmensi-js.js
          node tools/zmensi-css.js
          node tools/verzie-suborov.js --oprav
          python3 tools/cta-kontrola.py
          node tools/seo-audit.js
          node tools/rozmery-obrazkov.js
          node tools/spolocne-casti.js --kontrola
          node tools/shopify-kontrola.js
      - name: Najprv uložiť assets, potom vyrobiť tému
        id: hotovo
        run: |
          set -euo pipefail
          git config user.name "koverta-bot"
          git config user.email "noreply@koverta.sk"
          git add assets '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Výkon: vygenerované assets a ich verzie"
            git push origin HEAD:${{ github.ref_name }}
          fi
          node tools/shopify-tema.js
          node tools/shopify-kontrola.js
          git add shopify-tema
          if ! git diff --cached --quiet; then
            git commit -m "Téma: zostavenie po uložených assets"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  lighthouse:
    needs: zostavit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        stranka: [uvod, pristresky-pre-auta, zahradne-pristresky, bioklimaticke-pergoly, realizacie, kontakt]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.zostavit.outputs.sha }}
          path: po
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 7c2415542bc85d151bddadcbdda0667e651e1c94
          path: pred
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pripraviť rovnaký merací nástroj a servery
        run: |
          cd po
          npm install --no-save lighthouse@12.8.2 chrome-launcher@1.0.0
          python3 -m http.server 8080 --directory ../pred > ../server-pred.log 2>&1 &
          python3 -m http.server 8081 --directory . > ../server-po.log 2>&1 &
      - name: Tri behy mobil aj desktop pred a po; živý obchod osobitne
        env:
          CHROME_PATH: /usr/bin/google-chrome
          STRANKA: ${{ matrix.stranka }}
        run: |
          cd po
          node tools/meraj-pagespeed.mjs --zaklad=http://localhost:8080 --cesta="$STRANKA" --vystup=../vysledky/pred
          node tools/meraj-pagespeed.mjs --zaklad=http://localhost:8081 --cesta="$STRANKA" --vystup=../vysledky/po
          node tools/meraj-pagespeed.mjs --zaklad=https://koverta.sk --obchod --cesta="$STRANKA" --vystup=../vysledky/obchod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vykon-${{ matrix.stranka }}
          path: vysledky/
          retention-days: 14
