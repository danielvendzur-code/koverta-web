name: Fix menu underline thickness

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: [.github/workflows/tmp-menu-hover-fix-20260911.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch underline animation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/koverta-2026.css')
          s=p.read_text(encoding='utf-8')
          old='''  left: 10px;\n  right: 10px;\n  bottom: 3px;\n  height: 2px;\n  border-radius: 2px;\n  background: var(--k-amber);\n  transform: scaleX(0);\n  transform-origin: left center;\n  transition: transform 240ms var(--k-ease-out);\n}\n.kv-nav__item.is-open > .kv-nav__link::after,\n.kv-nav__link[aria-current="page"]::after { transform: none; }'''
          new='''  left: 10px;\n  right: auto;\n  bottom: 3px;\n  width: 0;\n  height: 2px;\n  border-radius: 1px;\n  background: var(--k-amber);\n  transition: width 240ms var(--k-ease-out);\n}\n.kv-nav__item.is-open > .kv-nav__link::after,\n.kv-nav__link[aria-current="page"]::after { width: calc(100% - 20px); }'''
          if old not in s:
              raise SystemExit('expected nav underline block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'transform: scaleX(0)' not in s[s.index('.kv-nav__link::after'):s.index('.kv-bar__side')]
          assert 'transition: width 240ms' in s[s.index('.kv-nav__link::after'):s.index('.kv-bar__side')]
          PY
          git diff --check
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8902 >/tmp/http.log 2>&1 &
          trap 'kill $! || true' EXIT
          sleep 1
          export NODE_PATH=/tmp/pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:900}});
            await p.goto('http://127.0.0.1:8902/index.html',{waitUntil:'domcontentloaded'});
            const item=p.locator('.kv-nav__item').first();
            const link=item.locator('.kv-nav__link').first();
            await p.evaluate(()=>document.querySelectorAll('[class*="cookie"],[id*="cookie"],[class*="consent"],[id*="consent"]').forEach(e=>e.remove()));
            const sample=async()=>link.evaluate(el=>{const s=getComputedStyle(el,'::after');return {h:parseFloat(s.height),w:parseFloat(s.width)}});
            const before=await sample();
            await item.evaluate(el=>el.classList.add('is-open'));
            await p.waitForTimeout(35); const a=await sample();
            await p.waitForTimeout(85); const c=await sample();
            await p.waitForTimeout(180); const d=await sample();
            for(const x of [before,a,c,d]) if(x.h!==2) throw new Error('underline height changed: '+JSON.stringify([before,a,c,d]));
            if(!(before.w<=a.w && a.w<=c.w && c.w<=d.w && d.w>20)) throw new Error('underline width not monotonic: '+JSON.stringify([before,a,c,d]));
            await p.screenshot({path:'/tmp/menu-hover-fixed.png'});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-menu-hover-fix-20260911.yml
          git add assets/koverta-2026.css
          git diff --cached --check
          git commit -m 'fix: keep menu underline thickness constant'
          git push origin HEAD:fix/koverta-final-repair-20260910