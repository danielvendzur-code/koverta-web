          done
          test "$(find qa-user-content -name '*.png' | wc -l)" -eq 12

      - uses: actions/upload-artifact@v4
        with:
          name: user-content-visual-qa-${{ github.sha }}
          path: qa-user-content/*.png
          if-no-files-found: error

      - name: Commit only scoped repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            index.html \
