name: User requested Koverta and Soltec content repair

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-user-content-finish-20260910.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply narrowly scoped content and presentation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, subprocess

          BRANCH = 'fix/koverta-final-repair-20260910'
          html_pages = [
              'index.html',
              'pristresky-pre-auta/index.html',
              'zahradne-pristresky/index.html',
              'carport-soltec/index.html',
              'bioklimaticke-pergoly/index.html',
              'pevne-prestresenia/index.html',
              'tienenie/index.html',
              'outdoor-kuchyne/index.html',
          ]
          expected_changes = set(html_pages + [
              'assets/koverta-2026.css',
              'assets/koverta-2026.js',
              'assets/koverta-sketch-carport.svg',
          ])

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          def image_size(path):
              data = Path(path).read_bytes()
              if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data) >= 24:
                  return struct.unpack('>II', data[16:24])
              if data[:2] == b'\xff\xd8':
                  i = 2
                  sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
                  while i + 9 < len(data):
                      if data[i] != 0xFF:
                          i += 1; continue
                      while i < len(data) and data[i] == 0xFF: i += 1
                      if i >= len(data): break
                      marker = data[i]; i += 1
                      if marker in {0xD8,0xD9} or 0xD0 <= marker <= 0xD7: continue
                      if i + 2 > len(data): break
                      length = int.from_bytes(data[i:i+2], 'big')
                      if length < 2 or i + length > len(data): break
                      if marker in sof and length >= 7:
                          h = int.from_bytes(data[i+3:i+5], 'big')
                          w = int.from_bytes(data[i+5:i+7], 'big')
                          return w,h
                      i += length
              raise SystemExit(f'Cannot read image dimensions: {path}')

          def asset_dims(src):
              rel = src.replace('../assets/','').replace('./assets/','')
              p = Path('assets') / rel
              if not p.is_file(): raise SystemExit(f'Missing asset: {p}')
              return image_size(p)

          def section_bounds(text, needle):
              pos = text.find(needle)
              if pos < 0: raise SystemExit(f'Section needle not found: {needle}')
              start = text.rfind('<section', 0, pos)
              if start < 0: raise SystemExit(f'No section before: {needle}')
              depth = 0
              for m in re.finditer(r'</?section\b[^>]*>', text[start:], re.I):
                  tag = m.group(0)
                  depth += -1 if tag.startswith('</') else 1
                  if depth == 0:
                      return start, start + m.end()
              raise SystemExit(f'Unclosed section around: {needle}')

          def replace_section(path, needle, replacement):
              text = read(path)
              a,b = section_bounds(text, needle)
              write(path, text[:a] + replacement.strip() + '\n' + text[b:])

          def set_img_tag(tag, src, alt):
              w,h = asset_dims(src)
              tag = re.sub(r'\s(?:src|alt|width|height|title)="[^"]*"', '', tag)
              close = ' />' if tag.rstrip().endswith('/>') else '>'
              tag = tag.rstrip()
              if tag.endswith('/>'): tag = tag[:-2].rstrip()
              elif tag.endswith('>'): tag = tag[:-1].rstrip()
              title = alt.split(' — ')[0]
              return f'{tag} src="{src}" alt="{alt}" title="{title}" width="{w}" height="{h}">{"" if close == ">" else ""}'

          def replace_first_img_after(path, marker, src, alt, max_distance=1800):
              text = read(path)
              pos = text.find(marker)
              if pos < 0: raise SystemExit(f'{path}: marker not found: {marker}')
              m = re.search(r'<img\b[^>]*>', text[pos:pos+max_distance], re.S|re.I)
              if not m: raise SystemExit(f'{path}: no img after marker: {marker}')
              a = pos + m.start(); b = pos + m.end()
              write(path, text[:a] + set_img_tag(text[a:b], src, alt) + text[b:])

          def replace_hero(path, old_h1_fragment, src, alt, new_h1=None):
              text = read(path)
              a,b = section_bounds(text, old_h1_fragment)
              sec = text[a:b]
              m = re.search(r'<img\b[^>]*>', sec, re.S|re.I)
              if not m: raise SystemExit(f'{path}: hero image missing')
              sec = sec[:m.start()] + set_img_tag(m.group(0), src, alt) + sec[m.end():]
              if new_h1:
                  sec2,n = re.subn(r'(<h1\b[^>]*>).*?(</h1>)', lambda x:x.group(1)+new_h1+x.group(2), sec, count=1, flags=re.S)
                  if n != 1: raise SystemExit(f'{path}: hero H1 replace failed')
                  sec = sec2
              write(path, text[:a] + sec + text[b:])

          def replace_card_img_by_label(path, label, src, alt):
              text = read(path)
              marker = f'<p class="kh-mat__label">{label}</p>'
              pos = text.find(marker)
              if pos < 0: raise SystemExit(f'{path}: material label missing: {label}')
              art = text.rfind('<article', 0, pos)
              if art < 0: raise SystemExit(f'{path}: article missing before {label}')
              m = re.search(r'<img\b[^>]*>', text[art:pos], re.S|re.I)
              if not m: raise SystemExit(f'{path}: image missing before {label}')
              a=art+m.start(); b=art+m.end()
              write(path, text[:a] + set_img_tag(text[a:b], src, alt) + text[b:])

          # ------------------------------------------------------------------
          # HOME: normal ordering/equal visual weight + corrected imagery.
          replace_first_img_after('index.html', 'href="./konfigurator/?page=koverta"', './assets/koverta-pristresok-garaz.jpg', 'Prístrešok Koverta pri rodinnom dome')
          replace_first_img_after('index.html', 'href="./konfigurator/?page=carport"', './assets/soltec-carport-f240-real.jpg', 'Profesionálna fotografia hliníkového carportu Soltec')
          replace_first_img_after('index.html', 'href="./konfigurator/?page=canopy"', './assets/soltec-canopy-glassport-balkon.jpg', 'Profesionálne prestrešenie terasy Soltec so sklenenou strechou')
          replace_first_img_after('index.html', '<a class="kh-ponuka__karta" href="./pristresky-pre-auta/">', './assets/koverta-carport-lamely-stena.jpg', 'Prístrešok Koverta pre auto s lamelovou bočnou výplňou')
          replace_first_img_after('index.html', '<a class="kh-ponuka__karta" href="./zahradne-pristresky/">', './assets/koverta-zahradny-pristresok-bratislava-detail.jpg', 'Záhradný prístrešok Koverta pri rodinnom dome v Bratislave')
          replace_first_img_after('index.html', '<a class="kh-ponuka__karta" href="./carport-soltec/">', './assets/soltec-carport-sl240-real.jpg', 'Profesionálna fotografia carportu Soltec SL 240')

          process = r'''
          <!-- ======================================================= 07 · PROCES -->
          <section class="k-band kh-proc" id="proces" aria-labelledby="procTitle">
            <div class="k-wrap">
              <div class="kh-proc__grid" data-k-process>
                <div class="kh-proc__aside">
                  <p class="k-eyebrow k-rise">Ako to prebieha</p>
                  <h2 id="procTitle" class="k-h2 k-rise" data-k-delay="1">Od návrhu po hotový prístrešok</h2>
                  <p class="k-copy k-rise" data-k-delay="2">Tri jasné kroky. Zameranie a návrh sú nezáväzné; technické riešenie podkladu potvrdíme podľa konkrétneho miesta.</p>
                  <div class="kh-proc__list k-rise" data-k-delay="3">
                    <button class="kh-proc__row" type="button" data-k-step-row><em>01</em><strong>Návrh a zameranie</strong></button>
                    <button class="kh-proc__row" type="button" data-k-step-row><em>02</em><strong>Výroba na mieru</strong></button>
                    <button class="kh-proc__row" type="button" data-k-step-row><em>03</em><strong>Montáž a odovzdanie</strong></button>
                  </div>
                </div>
                <div class="kh-proc__panels k-reveal">
                  <article class="kh-proc__panel" data-k-step>
                    <span class="kh-proc__media"><img src="./assets/koverta-carport-pri-garazi.jpg" width="1600" height="1200" alt="Prístrešok Koverta pri dome ako referencia pre návrh a zameranie" loading="lazy" decoding="async"></span>
                    <span class="kh-proc__body"><span class="kh-proc__num">01</span><h3 class="k-h3">Návrh a zameranie</h3><p class="k-copy">Povieme si účel, rozmer a výbavu, zameriame priestor a ešte pred výrobou odsúhlasíme konkrétnu zostavu.</p></span>
                  </article>
                  <article class="kh-proc__panel" data-k-step>
                    <span class="kh-proc__media"><img src="./assets/koverta-pristresok-garaz.jpg" width="1800" height="1350" alt="Oceľový prístrešok Koverta vyrobený podľa odsúhlaseného návrhu" loading="lazy" decoding="async"></span>
                    <span class="kh-proc__body"><span class="kh-proc__num">02</span><h3 class="k-h3">Výroba na mieru</h3><p class="k-copy">Konštrukciu pripravíme podľa odsúhlaseného návrhu, zvoleného povrchu a výbavy. Zmeny riešime pred výrobou, nie až na stavbe.</p></span>
                  </article>
                  <article class="kh-proc__panel" data-k-step>
                    <span class="kh-proc__media"><img src="./assets/soltec-carport-sl240-real.jpg" width="2400" height="1500" alt="Hotový hliníkový carport Soltec po montáži" loading="lazy" decoding="async"></span>
                    <span class="kh-proc__body"><span class="kh-proc__num">03</span><h3 class="k-h3">Montáž a odovzdanie</h3><p class="k-copy">Dovezieme zostavu, osadíme ju podľa návrhu a po dokončení ju odovzdáme pripravenú na používanie.</p></span>
                  </article>
                </div>
              </div>
            </div>
          </section>
          '''
          replace_section('index.html', 'Od prvého kontaktu', process)

          # ------------------------------------------------------------------
          # KOVERTA AUTO: new hero, higher-quality detail photos, roof angle, 4-card set.
          replace_hero('pristresky-pre-auta/index.html', 'Auto pod strechou', '../assets/koverta-pristresok-auto-trnava-hero.jpg', 'Prístrešok Koverta pre autá pri rodinnom dome v Trnave')
          replace_card_img_by_label('pristresky-pre-auta/index.html', 'Konštrukcia', '../assets/koverta-pristresok-garaz.jpg', 'Oceľová nosná konštrukcia prístrešku Koverta pri dome')
          replace_card_img_by_label('pristresky-pre-auta/index.html', 'Strecha', '../assets/koverta-pristresok-auto-trnava-sikmy.jpg', 'Šikmý pohľad zhora na strechu prístrešku Koverta v Trnave')
          replace_card_img_by_label('pristresky-pre-auta/index.html', 'Výplne', '../assets/koverta-carport-lamely-stena.jpg', 'Prístrešok Koverta s lamelovou bočnou výplňou')
          auto = read('pristresky-pre-auta/index.html')
          if '<p class="kh-mat__label">Doplnky</p>' not in auto:
              pos = auto.find('<p class="kh-mat__label">Výplne</p>')
              art_end = auto.find('</article>', pos)
              if pos < 0 or art_end < 0: raise SystemExit('Cannot append accessories card')
              art_end += len('</article>')
              w,h = asset_dims('../assets/koverta-zahradny-pristresok-bratislava-detail.jpg')
              extra = f'''
              <article class="kh-mat__card k-rise" data-k-delay="4">
                <div class="kh-mat__media"><img src="../assets/koverta-zahradny-pristresok-bratislava-detail.jpg" width="{w}" height="{h}" alt="Detail prístrešku Koverta s doplnkovým riešením pri dome" title="Doplnky prístrešku Koverta" decoding="async" loading="lazy"></div>
                <div class="kh-mat__body">
                  <p class="kh-mat__label">Doplnky</p>
                  <h3 class="kh-mat__title">Výbava sa rieši spolu s návrhom</h3>
                  <p class="kh-mat__text">Bočné výplne, osvetlenie, elektroprípravu a odvodnenie zahrnieme do konkrétnej zostavy podľa miesta a odsúhlaseného návrhu.</p>
                  <div class="kh-mat__pata"><div class="kh-mat__udaj"><p class="kh-mat__pojem">Výbava</p><p class="kh-mat__hodnota">podľa zostavy</p></div><div class="kh-mat__udaj"><p class="kh-mat__pojem">Návrh</p><p class="kh-mat__hodnota">pred výrobou</p></div></div>
                </div>
              </article>'''
              auto = auto[:art_end] + extra + auto[art_end:]
              write('pristresky-pre-auta/index.html', auto)
          auto = read('pristresky-pre-auta/index.html')
          auto = auto.replace('../assets/koverta-carport-dve-auta-zima.jpg', '../assets/koverta-pristresok-nakladne-auto.jpg')
          auto = auto.replace('Žľab a zvod sú súčasťou zostavy; izolácia proti teplu a hluku je doplnok.', 'Odvodnenie riešime podľa konkrétnej zostavy; izolácia proti teplu a hluku je doplnok.')
          auto = auto.replace('Žľab a zvod sú súčasťou zostavy; ich vyhotovenie a vedenie sa určia podľa konkrétneho prístrešku.', 'Odvodnenie je riešené podľa konkrétnej zostavy; ak je zvolené, vyhotovenie žľabu a vedenie zvodu určí návrh.')
          auto = auto.replace('<b>Odvodnenie</b> — žľab a zvod sú súčasťou zostavy; vyústenie sa navrhne podľa podkladu', '<b>Odvodnenie</b> — rieši sa podľa konkrétnej zostavy; trasu žľabu a zvodu určí návrh')
          write('pristresky-pre-auta/index.html', auto)

          # ------------------------------------------------------------------
          # KOVERTA GARDEN: page identity first + corrected situational photos.
          replace_hero('zahradne-pristresky/index.html', 'Terasa použiteľná', '../assets/koverta-zahradny-pristresok-bratislava-hero.jpg', 'Záhradný prístrešok Koverta nad terasou pri rodinnom dome v Bratislave', 'Záhradné prístrešky Koverta')
          replace_first_img_after('zahradne-pristresky/index.html', '<h3 class="kh-mat__title">Na zelenej ploche</h3>', '../assets/koverta-zahradny-pristresok-bratislava-hero.jpg', 'Záhradný prístrešok Koverta pri rodinnom dome — riešenie osadenia podľa pripraveného podkladu', 3000)
          replace_first_img_after('zahradne-pristresky/index.html', '<h3 class="kh-mat__title">Na hotovej ploche</h3>', '../assets/koverta-pristresok-garaz.jpg', 'Prístrešok Koverta osadený pri hotovej spevnenej ploche', 3000)
          replace_first_img_after('zahradne-pristresky/index.html', '<h3 class="kh-mat__title">Pri dome</h3>', '../assets/koverta-zahradny-pristresok-bratislava-detail.jpg', 'Detail prístrešku Koverta pri fasáde rodinného domu', 3000)
          garden = read('zahradne-pristresky/index.html')
          garden = garden.replace('Osem vecí, ktoré sa rozhodujú v tomto poradí', 'Osem bodov, ktoré držia návrh pokope')
          garden = garden.replace('Poradie je pri každej stavbe rovnaké. Viete tak dopredu, čo od vás budeme kedy potrebovať a kedy sa čo dá ešte zmeniť.', 'Konštrukciu, strechu, výplne, odvodnenie aj kotvenie riešime ako jeden návrh. Vďaka tomu sú technické detaily vyriešené skôr, než sa začne výroba.')
          write('zahradne-pristresky/index.html', garden)

          # ------------------------------------------------------------------
          # SOLTEC CARPORT: restore visual comparison, keep current verified facts, box separate.
          carport_models = r'''
          <section class="k-band k-bone k-model-section" id="modely-carport" aria-labelledby="carportModelsTitle">
            <div class="k-rules" aria-hidden="true"></div>
            <div class="k-wrap">
              <header class="k-head k-head--split">
                <div class="k-head__title">
                  <p class="k-eyebrow k-rise">SL 170 alebo SL 240</p>
                  <h2 id="carportModelsTitle" class="k-h2 k-rise" data-k-headline data-k-delay="1">Dva modely. Rozdiel vidíte hneď.</h2>
                </div>
                <div class="k-rise" data-k-delay="2">
                  <p class="k-copy"><strong>SL 170 je pre jedno auto.</strong> <strong>SL 240 je pre dve autá.</strong> Box je samostatný doplnok a do základného porovnania modelov ho nemiešame.</p>
                  <a class="k-btn k-btn--line" href="../konfigurator/?page=carport">Vyskúšať v konfigurátore</a>
                </div>
              </header>
              <div class="k-model-grid k-model-grid--2">
                <article class="k-model-card k-rise" data-k-delay="1">
                  <figure class="k-model-card__media"><img src="../assets/soltec-carport-f240-real.jpg" width="2400" height="1500" alt="Profesionálna fotografia hliníkového carportu Soltec" loading="lazy" decoding="async"></figure>
                  <div class="k-model-card__body"><div class="k-model-card__top"><span class="k-model-card__code">SL 170</span><span class="k-model-card__use">1 auto</span></div><h3>Úspornejší pôdorys pre jedno auto</h3><dl class="k-model-facts"><div><dt>Max. šírka</dt><dd>3,14 m</dd></div><div><dt>Max. dĺžka</dt><dd>8,0 m</dd></div><div><dt>Využitie</dt><dd>jedno státie</dd></div></dl></div>
                </article>
                <article class="k-model-card k-rise" data-k-delay="2">
                  <figure class="k-model-card__media"><img src="../assets/soltec-carport-sl240-real.jpg" width="2400" height="1500" alt="Profesionálna fotografia dvojmiestneho hliníkového carportu Soltec" loading="lazy" decoding="async"></figure>
                  <div class="k-model-card__body"><div class="k-model-card__top"><span class="k-model-card__code">SL 240</span><span class="k-model-card__use">2 autá</span></div><h3>Širší systém pre dve autá</h3><dl class="k-model-facts"><div><dt>Max. šírka</dt><dd>6,0 m</dd></div><div><dt>Max. dĺžka</dt><dd>8,5 m</dd></div><div><dt>Využitie</dt><dd>dve státia</dd></div></dl></div>
                </article>
              </div>
              <div class="k-model-note k-rise" data-k-delay="3"><strong>Box sa rieši samostatne.</strong><span>Jeho poloha a nadväzujúce prvky sa majú zahrnúť už do návrhu konkrétnej zostavy.</span></div>
            </div>
          </section>
          '''
          replace_section('carport-soltec/index.html', 'Rozdiel vidíte v jednej tabuľke', carport_models)

          # ------------------------------------------------------------------
          # SOLTEC BIO: six visual type cards, grouped by row; verified current dimensions preserved.
          bio_models = r'''
          <section class="k-band k-bone k-model-section" id="typy-bio" aria-labelledby="typTitle">
            <div class="k-rules" aria-hidden="true"></div><div class="k-wrap">
              <header class="k-head k-head--split"><div class="k-head__title"><p class="k-eyebrow k-rise">Šesť typoradov</p><h2 id="typTitle" class="k-h2 k-rise" data-k-headline data-k-delay="1">Najprv rad. Potom rozmer.</h2></div><div class="k-rise" data-k-delay="2"><p class="k-copy">Typorad vychádza zo šírky, dĺžky a počtu stĺpov. Namiesto jednej širokej tabuľky sú všetky možnosti vedľa seba ako samostatné karty.</p><a class="k-btn k-btn--line" href="../konfigurator/?page=bio">Vyskúšať v konfigurátore</a></div></header>
              <div class="k-model-family"><div class="k-model-family__head"><span>SL 170</span><p>Kompaktnejší nosný profil pre menšie a stredné rozpätia.</p></div><div class="k-model-grid k-model-grid--3">
                <article class="k-model-card"><figure class="k-model-card__media"><img src="../assets/soltec-bio-lifestyle.jpg" width="1656" height="1190" alt="Profesionálna fotografia bioklimatickej pergoly Soltec" loading="lazy" decoding="async"></figure><div class="k-model-card__body"><span class="k-model-card__code">SL 170/28</span><h3>Do šírky 3,5 m</h3><dl class="k-model-facts"><div><dt>4 stĺpy</dt><dd>3,5 × 6,5 m</dd></div><div><dt>6 stĺpov</dt><dd>3,5 × 9,3 m</dd></div><div><dt>Lamela</dt><dd>200 / 28 mm</dd></div></dl></div></article>
                <article class="k-model-card"><figure class="k-model-card__media"><img src="../assets/soltec-bio-spring-2024.jpg" width="1656" height="1190" alt="Profesionálna fotografia pergoly Soltec pri dome" loading="lazy" decoding="async"></figure><div class="k-model-card__body"><span class="k-model-card__code">SL 170/36</span><h3>Do šírky 4,3 m</h3><dl class="k-model-facts"><div><dt>4 stĺpy</dt><dd>4,3 × 6,5 m</dd></div><div><dt>6 stĺpov</dt><dd>4,3 × 9,3 m</dd></div><div><dt>Lamela</dt><dd>200 / 36 mm</dd></div></dl></div></article>
                <article class="k-model-card"><figure class="k-model-card__media"><img src="../assets/soltec-bio-lamely-real.jpg" width="2000" height="1467" alt="Detail otočných lamiel bioklimatickej pergoly Soltec" loading="lazy" decoding="async"></figure><div class="k-model-card__body"><span class="k-model-card__code">SL 170/42</span><h3>Do šírky 4,8 m</h3><dl class="k-model-facts"><div><dt>4 stĺpy</dt><dd>4,8 × 6,5 m</dd></div><div><dt>6 stĺpov</dt><dd>4,8 × 9,3 m</dd></div><div><dt>Lamela</dt><dd>200 / 42 mm</dd></div></dl></div></article>
              </div></div>
              <div class="k-model-family"><div class="k-model-family__head"><span>SL 240</span><p>Väčší nosný profil pre dlhšie a širšie zostavy.</p></div><div class="k-model-grid k-model-grid--3">
                <article class="k-model-card"><figure class="k-model-card__media"><img src="../assets/soltec-bio-summer-2024.jpg" width="1656" height="1190" alt="Profesionálna fotografia bioklimatickej pergoly Soltec v lete" loading="lazy" decoding="async"></figure><div class="k-model-card__body"><span class="k-model-card__code">SL 240/36</span><h3>Do šírky 4,3 m</h3><dl class="k-model-facts"><div><dt>4 stĺpy</dt><dd>4,3 × 8,0 m</dd></div><div><dt>6 stĺpov</dt><dd>4,3 × 9,0 m</dd></div><div><dt>Lamela</dt><dd>200 / 36 mm</dd></div></dl></div></article>
