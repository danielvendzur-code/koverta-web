name: Koverta Agent 02 Occlusion QA

on:
  push:
    branches:
      - agent/02-koverta-occlusion-qa

permissions:
  contents: read

jobs:
  mandatory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - osnova-podla-expivi
          - prekrytie
          - strecha-nepresvita
          - stlpy-vidno
          - plynulost
          - layout-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/?page=koverta >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Run unchanged mandatory QA
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: node konfigurator/test/${{ matrix.test }}.js
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-02-mandatory-${{ matrix.test }}
          path: qa-artifacts
          if-no-files-found: ignore

  full-occlusion-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/?page=koverta >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Sweep all supported Koverta dimensions
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: node coordination/koverta/02-occlusion-sweep.js
      - name: Upload occlusion sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-02-full-occlusion-sweep
          path: qa-artifacts
          if-no-files-found: error


  component-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/?page=koverta >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Isolate Koverta component visibility
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: node coordination/koverta/02-component-visibility.js
      - name: Upload component visibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-02-component-visibility
          path: qa-artifacts
          if-no-files-found: error
