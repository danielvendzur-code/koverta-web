name: Batch 6 color swatch QA
# QA revision 2: inspect hidden hover copy through textContent

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch6-farby-20260911.yml

permissions:
  contents: write

jobs:
  batch6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply scoped copy corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bioklimaticke-pergoly/index.html')
          s=p.read_text(encoding='utf-8')
          pairs={
            'Svetlý odtieň na tej istej konštrukcii. Rozdiel je vidieť až na stavbe, nie na obrazovke — pri zameraní ukážeme lakované vzorkovníky.':
            'Svetlý odtieň na konštrukcii. Rozdiel je vidieť až na stavbe, nie na obrazovke — pri zameraní ukážeme lakované vzorkovníky.',
            '<span class="kh-fakty__cislo">matná / mikro</span>\n        <span class="kh-fakty__co">Štruktúru si volíte tiež</span>\n        <span class="kh-fakty__pod">Pri odtieni mimo osmičky si vyberáte aj povrch: hladký matný, alebo mikroštruktúra, na ktorej nie sú vidieť odtlačky.</span>':
            '<span class="kh-fakty__cislo">mikroštruktúra</span>\n        <span class="kh-fakty__co">Základná osmička v matnom povrchu</span>\n        <span class="kh-fakty__pod">Všetkých osem štandardných odtieňov je v matnej mikroštruktúre — jemne zrnitej, bez lesku.</span>'
          }
          for old,new in pairs.items():
              if s.count(old)!=1: raise SystemExit(f'expected one match, got {s.count(old)} for {old[:45]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "bioklimaticke-pergoly/index.html"

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/koverta-b6-pw qa-batch6
          cd /tmp/koverta-b6-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1

      - name: Browser QA and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8908 >/tmp/koverta-b6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          export NODE_PATH=/tmp/koverta-b6-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node - <<'JS'
          const { chromium }=require('playwright');
          const path=require('path'), p=require('node:process');
          const expected=[
            ['Čokoládová hnedá','RAL 8017','rgb(69, 50, 46)'],
            ['Antracitová sivá','RAL 7016','rgb(56, 62, 66)'],
            ['Tmavá sivá DB','RAL DB703','rgb(74, 75, 76)'],
            ['Sivý hliník','RAL 9007','rgb(143, 143, 140)'],
            ['Biely hliník','RAL 9006','rgb(165, 168, 166)'],
            ['Sivobiela','RAL 9002','rgb(215, 213, 203)'],
            ['Perlová biela','RAL 1013','rgb(227, 217, 198)'],
            ['Dopravná biela','RAL 9016','rgb(241, 240, 234)'],
          ];
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:p.env.CHROME,args:['--no-sandbox','--disable-gpu']});
            for(const cfg of [{w:1440,h:1000,n:'desktop'},{w:390,h:844,n:'mobile'}]){
              const c=await b.newContext({viewport:{width:cfg.w,height:cfg.h}}); const page=await c.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8908/bioklimaticke-pergoly/#farbyTitle',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(800);
              const consent=page.getByRole('button',{name:/Iba nevyhnutné|Odmietnuť|Nevyhnutné/i}).first(); if(await consent.count()){try{await consent.click({timeout:600})}catch{}}
              const sec=page.locator('section.kh-farby'); if(await sec.count()!==1) throw new Error('farby section missing');
              await sec.scrollIntoViewIfNeeded(); await page.waitForTimeout(300);
              const sw=sec.locator('.kh-odtien'); if(await sw.count()!==8) throw new Error('swatch count '+await sw.count());
              for(let i=0;i<8;i++){
                const row=sw.nth(i); const text=(await row.innerText()).replace(/\s+/g,' ').trim();
                if(!text.includes(expected[i][0])||!text.includes(expected[i][1])) throw new Error('swatch text/order drift '+i+': '+text);
                const bg=await row.locator('i').evaluate(el=>getComputedStyle(el).backgroundColor);
                if(bg!==expected[i][2]) throw new Error('swatch color drift '+i+': '+bg);
              }
              const copy=(await sec.textContent()).replace(/\s+/g,' ');
              if(!/osem odtieňov je v cene/i.test(copy)) throw new Error('included-price statement missing');
              if(!/palety RAL.*objednávku|RAL.*na objednávku/i.test(copy)) throw new Error('RAL order statement missing');
              if(/hladký matný, alebo mikroštruktúra/i.test(copy)) throw new Error('contradictory finish copy remains');
              if(!/matnej mikroštruktúre/i.test(copy)) throw new Error('microtexture statement missing');
              const imgs=sec.locator('.kh-vzor__fotky img'); if(await imgs.count()!==2) throw new Error('expected two construction images');
              for(let i=0;i<2;i++){await imgs.nth(i).scrollIntoViewIfNeeded().catch(()=>{}); await page.waitForTimeout(120); const st=await imgs.nth(i).evaluate(el=>({c:el.complete,w:el.naturalWidth,h:el.naturalHeight})); if(!st.c||st.w<100||st.h<100) throw new Error('broken construction image '+JSON.stringify(st));}
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(overflow>2) throw new Error('horizontal overflow '+overflow);
              if(cfg.n==='mobile'){
                const first=await sw.first().boundingBox(), second=await sw.nth(1).boundingBox();
                if(!first||!second||second.y<=first.y) throw new Error('mobile swatches are not vertical');
                const dot=await sw.first().locator('i').boundingBox(); if(!dot||dot.width<44||dot.height<44) throw new Error('mobile swatch under 44px');
              }
              if(errors.length) throw new Error(errors.join(' | '));
              await sec.screenshot({path:path.join(p.env.GITHUB_WORKSPACE,'qa-batch6','farby-'+cfg.n+'.png')});
              await c.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: batch6-farby-${{ github.sha }}
          path: qa-batch6/*.png
          if-no-files-found: error

      - name: Commit validated copy and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bioklimaticke-pergoly/index.html
          git commit -m 'fix: clarify Soltec color finishes'
          git rm .github/workflows/tmp-batch6-farby-20260911.yml .github/workflows/tmp-locate-farby-20260911.yml
          git commit -m 'ci: remove temporary batch 6 discovery files'
          git push origin HEAD:fix/koverta-final-repair-20260910
