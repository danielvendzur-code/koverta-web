name: Batch 3 kitchen and shading content QA

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch3-kitchen-shading-20260911.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply verified content patch
        run: |
          python3 scripts/tmp-batch3-apply.py
          git diff --check

      - name: Browser QA and screenshots
        run: |
          python3 -m http.server 8903 >/tmp/koverta-b3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          mkdir -p /tmp/koverta-b3-pw qa-batch3
          cd /tmp/koverta-b3-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/koverta-b3-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node scripts/tmp-batch3-check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch3-kitchen-shading-${{ github.sha }}
          path: qa-batch3/*.png
          if-no-files-found: error

      - name: Commit product changes and remove temporary QA files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outdoor-kuchyne/index.html tienenie/index.html assets/koverta-2026.css
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' assets/koverta-2026.css outdoor-kuchyne/index.html tienenie/index.html)"
          test "$staged" = "$expected"
          git commit -m 'fix: clarify kitchen and shading product choices'
          git rm .github/workflows/tmp-batch3-kitchen-shading-20260911.yml scripts/tmp-batch3-apply.py scripts/tmp-batch3-check.js
          git commit -m 'ci: remove temporary batch 3 QA files'
          git push origin HEAD:fix/koverta-final-repair-20260910
