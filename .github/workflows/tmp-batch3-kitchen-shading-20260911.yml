name: Batch 3 kitchen and shading content QA

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch3-kitchen-shading-20260911.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply verified kitchen and shading improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          kitchen_path = Path('outdoor-kuchyne/index.html')
          shade_path = Path('tienenie/index.html')
          css_path = Path('assets/koverta-2026.css')
          kitchen = kitchen_path.read_text(encoding='utf-8')
          shade = shade_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          def one_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # ----------------------------- OUTDOOR KITCHENS
          kitchen = one_replace(
              kitchen,
              '<p class="k-copy">Chef je kuchyňa, Station grilovacia stanica. Postavia sa vedľa seba aj samostatne.</p>',
              '<p class="k-copy">Chef Grand a Classic majú pracovnú výšku 92 cm, Station Compact a Mini 67 cm. Všetky štyri moduly majú hĺbku 70 cm; šírka jednotlivých modelov ide od 65 do 303 cm.</p>',
              'kitchen model intro'
          )

          kitchen_specs = '''<div class="kh-kitchen-specs k-rise" data-k-delay="2" aria-label="Rozmery modelov Soltec Outdoor Kitchen">
      <div class="kh-kitchen-spec"><span>Chef Grand 3.0</span><strong>303 × 70 × 92 cm</strong><small>najväčší modul</small></div>
      <div class="kh-kitchen-spec"><span>Chef Classic 2.1</span><strong>213 × 70 × 92 cm</strong><small>plná pracovná výška</small></div>
      <div class="kh-kitchen-spec"><span>Station Compact 0,9</span><strong>95 × 70 × 67 cm</strong><small>kompaktná stanica</small></div>
      <div class="kh-kitchen-spec"><span>Station Mini 0,6</span><strong>65 × 70 × 67 cm</strong><small>najmenší modul</small></div>
    </div>

    <div class="kh-modul__mieru kh-modul__mieru--refined k-rise" data-k-delay="2">'''
          kitchen = one_replace(
              kitchen,
              '<div class="kh-modul__mieru k-rise" data-k-delay="2">',
              kitchen_specs,
              'kitchen dimension strip anchor'
          )

          kitchen = one_replace(
              kitchen,
              '<ul class="kh-vyb k-rise" data-k-delay="2">',
              '<ul class="kh-vyb kh-kitchen-facts k-rise" data-k-delay="2">\n      <li><strong>ALU</strong><span>ľahká konštrukcia a kompozitný obklad do exteriéru</span></li>',
              'kitchen facts class'
          )
          kitchen = one_replace(
              kitchen,
              '<li><strong>10 rokov*</strong><span>záruka na ALU kompozit a kameň</span></li>',
              '<li><strong>10 rokov*</strong><span>záruka na ALU kompozit a technický kameň</span></li>\n      <li><strong>0–20 mm</strong><span>výškovo nastaviteľné nohy na dorovnanie podkladu</span></li>',
              'kitchen verified extra fact'
          )
          kitchen = one_replace(
              kitchen,
              '<li><strong>20 mm</strong><span>kamenná doska s odkvapkávacou hranou</span></li>',
              '<li><strong>20 mm</strong><span>technický kameň s odkvapkávacou hranou</span></li>',
              'kitchen stone terminology'
          )
          kitchen = one_replace(
              kitchen,
              '<li><strong>Blum</strong><span>zásuvky s jemným dotvorením</span></li>',
              '<li><strong>BLUM</strong><span>zásuvky s mechanizmom mäkkého dovretia</span></li>',
              'kitchen BLUM terminology'
          )
          kitchen = one_replace(
              kitchen,
              '<li><strong>104 l</strong><span>chladnička, mraznička 14 l</span></li>',
              '<li><strong>104 + 14 l</strong><span>voliteľná chladnička s 14 l mraziacou časťou</span></li>',
              'kitchen refrigerator fact'
          )

          # ----------------------------- SHADING
          shade = one_replace(
              shade,
              'Päť spôsobov, ako uzavrieť jedno pole',
              'Päť riešení pre súkromie, vietor a slnko',
              'shading decision heading'
          )
          shade = one_replace(
              shade,
              '<p class="k-copy">Od tkaniny, ktorá sa navinie do kazety, po pevnú stenu. Každé riešenie má inú najväčšiu šírku — podľa nej vyjde, koľko polí bude terasa potrebovať.</p>',
              '<p class="k-copy">ZIP sa po vytiahnutí schová do kazety, H50 sa posúva v lištách, FW25 a FI30 zostávajú pevné a sklo G1/G2 uzatvorí priestor bez straty výhľadu. Nižšie sú limity, podľa ktorých sa návrh rozdelí na polia.</p>',
              'shading decision intro'
          )

          shade_guide = '''<div class="kh-shade-guide k-rise" data-k-delay="3" aria-label="Rýchle porovnanie tienenia a bočných výplní">
      <div class="kh-shade-guide__item"><span>K130</span><strong>ZIP roleta</strong><small>max. 6,5 × 2,8 m · dynamické uzatvorenie</small></div>
      <div class="kh-shade-guide__item"><span>H50</span><strong>Posuvný panel</strong><small>panel max. 1,4 × 3,0 m · ALU rám</small></div>
      <div class="kh-shade-guide__item"><span>FW25</span><strong>Drevená stena</strong><small>bez viditeľného spoja do 4,0 m</small></div>
      <div class="kh-shade-guide__item"><span>FI30</span><strong>ISO stena</strong><small>3 cm izolácia · bez spoja do 6,0 m</small></div>
      <div class="kh-shade-guide__item"><span>G1 / G2</span><strong>Kalené sklo</strong><small>10 mm · posuvné alebo skladacie</small></div>
    </div>

    <ul class="kh-typ kh-typ--refined">'''
          shade = one_replace(
              shade,
              '<ul class="kh-typ">',
              shade_guide,
              'shading guide anchor'
          )
          shade = one_replace(
              shade,
              'Výška 3 000 mm<br>Šírka 6 500 mm',
              'Výška 2 800 mm<br>Šírka 6 500 mm',
              'K130 2026 max dimensions'
          )
          shade = one_replace(
              shade,
              'Výška podľa konštrukcie<br>Šírka 4 000 mm',
              'Dĺžka do 4 000 mm<br>bez viditeľného spoja',
              'FW25 verified span'
          )
          shade = one_replace(
              shade,
              'Výška podľa konštrukcie<br>Šírka 6 000 mm',
              'Dĺžka do 6 000 mm<br>bez viditeľného spoja',
              'FI30 verified span'
          )
          shade = one_replace(
              shade,
              '<p class="kh-pojem">Jedno pole najviac</p>\n          <p class="kh-typ__udaj">Výška podľa konštrukcie<br>Šírka podľa počtu panelov</p>',
              '<p class="kh-pojem">Rozmer jedného panela</p>\n          <p class="kh-typ__udaj">G1: max. 1 200 × 2 800 mm<br>G2: max. 650 × 2 800 mm</p>',
              'G1 G2 verified panel dimensions'
          )

          # Both pages changed styling, so bust only their CSS references.
          for label, text in [('kitchen', kitchen), ('shading', shade)]:
              if text.count('../assets/koverta-2026.css?v=1788846952174') != 1:
                  raise SystemExit(f'{label}: unexpected stylesheet reference count')
          kitchen = kitchen.replace('../assets/koverta-2026.css?v=1788846952174', '../assets/koverta-2026.css?v=2026091103', 1)
          shade = shade.replace('../assets/koverta-2026.css?v=1788846952174', '../assets/koverta-2026.css?v=2026091103', 1)

          marker = '/* BATCH 3 · KITCHEN + SHADING DECISION LAYER */'
          if marker in css:
              raise SystemExit('batch 3 CSS marker already exists')
          css += r'''

/* BATCH 3 · KITCHEN + SHADING DECISION LAYER */
/* Verified-product facts are shown as compact decision aids instead of a
   loose row of isolated numbers. The structure stays in the existing visual
   language: white/bone surfaces, hairlines, Archivo, amber only as accent. */
.k .kh-kitchen-specs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: clamp(24px, 3vw, 42px) 0 0;
  border: 1px solid var(--k-hair);
  border-radius: var(--k-r-sm);
  overflow: hidden;
  background: var(--k-white);
  box-shadow: var(--k-shadow-xs);
}
.k .kh-kitchen-spec {
  display: grid;
  align-content: start;
  gap: 5px;
  min-height: 126px;
  padding: clamp(18px, 2vw, 28px);
  border-left: 1px solid var(--k-hair-soft);
}
.k .kh-kitchen-spec:first-child { border-left: 0; }
.k .kh-kitchen-spec span {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--k-grey-soft);
}
.k .kh-kitchen-spec strong {
  font-family: var(--k-head);
  font-size: clamp(20px, 1.65vw, 25px);
  line-height: 1.15;
  letter-spacing: -.025em;
  color: var(--k-ink);
}
.k .kh-kitchen-spec small { font-size: 13px; line-height: 1.4; color: var(--k-muted); }
.k .kh-modul__mieru--refined { margin-top: 14px; }
.k .kh-kitchen-facts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  border-top: 1px solid var(--k-hair);
  border-bottom: 1px solid var(--k-hair);
}
.k .kh-kitchen-facts > li {
  min-width: 0;
  padding: 22px 20px;
  border-top: 0;
  border-right: 1px solid var(--k-hair-soft);
}
.k .kh-kitchen-facts > li:nth-child(4n) { border-right: 0; }
.k .kh-kitchen-facts > li:nth-child(n+5) { border-top: 1px solid var(--k-hair-soft); }
.k .kh-kitchen-facts strong {
  display: block;
  margin-bottom: 7px;
  font-size: clamp(18px, 1.45vw, 23px);
  line-height: 1.12;
}
.k .kh-kitchen-facts span { display: block; max-width: 27ch; font-size: 13.5px; line-height: 1.45; color: var(--k-muted); }

.k .kh-shade-guide {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  margin: clamp(24px, 3vw, 40px) 0 clamp(18px, 2vw, 30px);
  border: 1px solid var(--k-hair);
  border-radius: var(--k-r-sm);
  overflow: hidden;
  background: var(--k-bone);
}
.k .kh-shade-guide__item {
  display: grid;
  align-content: start;
  gap: 5px;
  min-height: 136px;
  padding: clamp(18px, 1.8vw, 26px);
  border-left: 1px solid var(--k-hair-soft);
}
.k .kh-shade-guide__item:first-child { border-left: 0; }
.k .kh-shade-guide__item > span {
  width: max-content;
  padding-bottom: 5px;
  border-bottom: 2px solid var(--k-amber);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
}
.k .kh-shade-guide__item strong {
  font-family: var(--k-head);
  font-size: clamp(17px, 1.35vw, 20px);
  line-height: 1.18;
  letter-spacing: -.02em;
}
.k .kh-shade-guide__item small { font-size: 13px; line-height: 1.45; color: var(--k-muted); }

/* The first shading row used to be a large black exception while all other
   options were white. A comparison works better when every option has equal
   visual weight; K130 remains identifiable by the existing model label. */
.k .kh-typ--refined .kh-typ__riadok--prvy {
  padding-block: inherit;
  border-color: var(--k-hair);
  background: var(--k-white);
  box-shadow: none;
}
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-pojem { color: var(--k-grey-soft); }
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-typ__model { font-size: inherit; color: var(--k-ink); }
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-typ__lamela,
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-typ__udaj,
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-typ__kotva { color: inherit; }
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-pas__draha { background: var(--k-hair); }
.k .kh-typ--refined .kh-typ__riadok--prvy .kh-pas__kota { color: var(--k-ink); }

@media (max-width: 999px) {
  .k .kh-kitchen-specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .k .kh-kitchen-spec:nth-child(3) { border-left: 0; }
  .k .kh-kitchen-spec:nth-child(n+3) { border-top: 1px solid var(--k-hair-soft); }
  .k .kh-kitchen-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .k .kh-kitchen-facts > li:nth-child(4n) { border-right: 1px solid var(--k-hair-soft); }
  .k .kh-kitchen-facts > li:nth-child(2n) { border-right: 0; }
  .k .kh-kitchen-facts > li:nth-child(n+3) { border-top: 1px solid var(--k-hair-soft); }
  .k .kh-shade-guide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .k .kh-shade-guide__item { border-top: 1px solid var(--k-hair-soft); }
  .k .kh-shade-guide__item:nth-child(1),
  .k .kh-shade-guide__item:nth-child(2) { border-top: 0; }
  .k .kh-shade-guide__item:nth-child(odd) { border-left: 0; }
  .k .kh-shade-guide__item:last-child { grid-column: 1 / -1; }
}
@media (max-width: 599px) {
  .k .kh-kitchen-specs,
  .k .kh-kitchen-facts,
  .k .kh-shade-guide { grid-template-columns: minmax(0, 1fr); }
  .k .kh-kitchen-spec,
  .k .kh-kitchen-spec:nth-child(3),
  .k .kh-kitchen-facts > li,
  .k .kh-shade-guide__item,
  .k .kh-shade-guide__item:nth-child(odd) {
    border-left: 0;
    border-right: 0;
  }
  .k .kh-kitchen-spec + .kh-kitchen-spec,
  .k .kh-kitchen-facts > li + li,
  .k .kh-shade-guide__item + .kh-shade-guide__item { border-top: 1px solid var(--k-hair-soft); }
  .k .kh-shade-guide__item:last-child { grid-column: auto; }
  .k .kh-kitchen-spec, .k .kh-shade-guide__item { min-height: 0; }
}
'''

          kitchen_path.write_text(kitchen, encoding='utf-8')
          shade_path.write_text(shade, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

          # Hard postconditions: verified facts and narrow file scope.
          kf = kitchen_path.read_text(encoding='utf-8')
          sf = shade_path.read_text(encoding='utf-8')
          cf = css_path.read_text(encoding='utf-8')
          required_kitchen = [
              '303 × 70 × 92 cm', '213 × 70 × 92 cm', '95 × 70 × 67 cm', '65 × 70 × 67 cm',
              '104 + 14 l', '0–20 mm', 'kh-kitchen-facts'
          ]
          required_shade = [
              'Výška 2 800 mm<br>Šírka 6 500 mm', 'panel max. 1,4 × 3,0 m',
              'Dĺžka do 4 000 mm<br>bez viditeľného spoja',
              'Dĺžka do 6 000 mm<br>bez viditeľného spoja',
              'G1: max. 1 200 × 2 800 mm<br>G2: max. 650 × 2 800 mm',
              'kh-typ kh-typ--refined'
          ]
          for token in required_kitchen:
              if token not in kf: raise SystemExit('missing kitchen postcondition: '+token)
          for token in required_shade:
              if token not in sf: raise SystemExit('missing shading postcondition: '+token)
          if marker not in cf: raise SystemExit('missing batch 3 css marker')
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected={'outdoor-kuchyne/index.html','tienenie/index.html','assets/koverta-2026.css'}
          if changed != expected:
              raise SystemExit(f'unexpected batch 3 scope: {sorted(changed)}')
          PY
          git diff --check

      - name: Browser QA and visual evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8903 >/tmp/koverta-b3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          mkdir -p /tmp/koverta-b3-pw qa-batch3
          cd /tmp/koverta-b3-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/koverta-b3-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          cat >/tmp/koverta-b3-pw/check.js <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          const p = require('node:process');
          const root=p.env.GITHUB_WORKSPACE;
          const base='http://127.0.0.1:8903';
          async function dismiss(page){
            const c=page.getByRole('button',{name:/Iba nevyhnutné|Odmietnuť|Nevyhnutné/i}).first();
            if(await c.count()) try{await c.click({timeout:1200})}catch(e){}
          }
          async function noOverflow(page,label){
            const d=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(d>2) throw new Error(label+' horizontal overflow '+d);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:p.env.CHROME,args:['--no-sandbox','--disable-gpu']});
            for(const item of [
              {slug:'/outdoor-kuchyne/', key:'kitchen', title:'#modelyTitle'},
              {slug:'/tienenie/', key:'shading', title:'#rozTitle'}
            ]){
              const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await ctx.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(base+item.slug,{waitUntil:'load',timeout:60000});
              await dismiss(page); await noOverflow(page,item.key+' desktop');
              const sec=page.locator(`section:has(${item.title})`);
              if(await sec.count()!==1) throw new Error(item.key+' target section missing');
              await sec.scrollIntoViewIfNeeded(); await page.waitForTimeout(650);
              if(item.key==='kitchen'){
                if(await sec.locator('.kh-kitchen-spec').count()!==4) throw new Error('kitchen spec strip != 4');
                if(await page.locator('.kh-kitchen-facts > li').count()!==8) throw new Error('kitchen fact count != 8');
                const txt=await sec.innerText();
                for(const v of ['303 × 70 × 92 cm','65 × 70 × 67 cm']) if(!txt.includes(v)) throw new Error('missing kitchen dimension '+v);
              } else {
                if(await sec.locator('.kh-shade-guide__item').count()!==5) throw new Error('shading guide != 5');
                const txt=await sec.innerText();
                for(const v of ['2 800 mm','6 500 mm','1 200 × 2 800 mm','650 × 2 800 mm']) if(!txt.includes(v)) throw new Error('missing shading value '+v);
                const firstBg=await sec.locator('.kh-typ__riadok--prvy').evaluate(el=>getComputedStyle(el).backgroundColor);
                if(firstBg==='rgb(18, 23, 26)') throw new Error('old black first shading row still active');
              }
              await sec.screenshot({path:path.join(root,'qa-batch3',item.key+'-desktop.png')});
              if(errors.length) throw new Error(item.key+' page errors: '+errors.join(' | '));
              await ctx.close();

              const mctx=await browser.newContext({viewport:{width:390,height:844}});
              const mp=await mctx.newPage(); const merr=[]; mp.on('pageerror',e=>merr.push(String(e)));
              await mp.goto(base+item.slug,{waitUntil:'load',timeout:60000});
              await dismiss(mp); await noOverflow(mp,item.key+' mobile');
              const msec=mp.locator(`section:has(${item.title})`);
              await msec.scrollIntoViewIfNeeded(); await mp.waitForTimeout(500);
              if(item.key==='kitchen'){
                if(await msec.locator('.kh-kitchen-spec').count()!==4) throw new Error('mobile kitchen specs lost');
              } else {
                if(await msec.locator('.kh-shade-guide__item').count()!==5) throw new Error('mobile shading guide lost');
              }
              await msec.screenshot({path:path.join(root,'qa-batch3',item.key+'-mobile.png')});
              if(merr.length) throw new Error(item.key+' mobile page errors: '+merr.join(' | '));
              await mctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);p.exit(1)});
          JS
          node /tmp/koverta-b3-pw/check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch3-kitchen-shading-${{ github.sha }}
          path: qa-batch3/*.png
          if-no-files-found: error

      - name: Commit batch 3 only and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outdoor-kuchyne/index.html tienenie/index.html assets/koverta-2026.css
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' assets/koverta-2026.css outdoor-kuchyne/index.html tienenie/index.html)"
          test "$staged" = "$expected"
          git commit -m 'fix: clarify kitchen and shading product choices'
          git rm .github/workflows/tmp-batch3-kitchen-shading-20260911.yml
          git commit -m 'ci: remove temporary batch 3 QA workflow'
          git push origin HEAD:fix/koverta-final-repair-20260910
