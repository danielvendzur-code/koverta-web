name: Final site audit 20260911

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: [.github/workflows/tmp-final-site-audit-20260911.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Correct remaining misleading carport gallery image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('carport-soltec/index.html')
          s=p.read_text(encoding='utf-8')
          old='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-canopy-f170-real.jpg" width="2000" height="1239" alt="SL 170 pre jedno auto" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">SL 170 pre jedno auto</p></div></article>'''
          new='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-carport-plavecky-03.jpg" alt="Hliníkový carport Soltec s otvoreným státím pri rodinnom dome" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">Carport Soltec s otvoreným státím</p></div></article>'''
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one misleading gallery card, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "carport-soltec/index.html"

      - name: Static local asset and content audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import posixpath

          roots=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          broken=[]
          class P(HTMLParser):
              def __init__(self, file): super().__init__(); self.file=file
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('src','href'):
                      raw=d.get(key)
                      if not raw or raw.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')): continue
                      if tag=='a' and key=='href': continue
                      val=urlsplit(raw).path
                      if not val: continue
                      val=unquote(val)
                      if val.startswith('/'):
                          target=Path('.'+val)
                      else:
                          target=self.file.parent / val
                      target=Path(posixpath.normpath(str(target)))
                      if target.suffix or tag in ('img','script','link','source','video'):
                          if not target.exists(): broken.append((str(self.file),tag,key,raw,str(target)))
          for f in roots:
              try:
                  parser=P(f); parser.feed(f.read_text(encoding='utf-8'))
              except UnicodeDecodeError: pass
          if broken:
              print('BROKEN LOCAL ASSETS:')
              for row in broken[:100]: print(row)
              raise SystemExit(1)

          car=Path('carport-soltec/index.html').read_text(encoding='utf-8')
          a=car.index('class="kh-cat__grid"'); b=car.index('</section>',a)
          gallery=car[a:b]
          if 'soltec-canopy-f170-real.jpg' in gallery: raise SystemExit('fixed-canopy F170 image still mislabeled in carport gallery')
          if 'SL 170 pre jedno auto' in gallery: raise SystemExit('unverified exact SL170 gallery claim remains')
          a=car.index('id="modely-carport"'); b=car.index('</section>',a)
          models=car[a:b]
          if 'soltec-carport-f240-real.jpg' in models: raise SystemExit('F240 asset still used in SL model cards')
          for token in ('SL 170','SL 240','3,14 m','8,0 m','6,0 m','8,5 m'):
              if token not in models: raise SystemExit('carport model fact missing: '+token)

          can=Path('pevne-prestresenia/index.html').read_text(encoding='utf-8')
          a=can.index('id="typy-prestresenia"'); b=can.index('</section>',a)
          sec=can[a:b]
          for token in ('F170','F240','G170','G240','soltec-canopy-f170-real.jpg','soltec-canopy-hero.jpg','soltec-canopy-glassport-balkon.jpg','soltec-canopy-glassport-pool.jpg'):
              if token not in sec: raise SystemExit('canopy model content missing: '+token)

          home=Path('index.html').read_text(encoding='utf-8')
          if home.count('data-k-step>') != 5: raise SystemExit('home process is not exactly 5 steps')
          perg=Path('bioklimaticke-pergoly/index.html').read_text(encoding='utf-8')
          if perg.count('class="kh-odtien"') != 8: raise SystemExit('Soltec standard color swatch count is not 8')
          print(f'Static asset audit passed across {len(roots)} HTML files')
          PY
          node --check assets/koverta-2026.js
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/koverta-cfg-enhance.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-site-pw qa-final-site
          cd /tmp/final-site-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1

      - name: Browser audit desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8911 >/tmp/final-site-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8911/ >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-site-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node - <<'JS'
          const {chromium}=require('playwright');
          const path=require('path'), proc=require('node:process');
          const routes=[
            ['home','/'],
            ['cars','/pristresky-pre-auta/'],
            ['garden','/zahradne-pristresky/'],
            ['carport','/carport-soltec/'],
            ['bio','/bioklimaticke-pergoly/'],
            ['canopy','/pevne-prestresenia/'],
            ['shade','/tienenie/'],
            ['kitchen','/outdoor-kuchyne/'],
            ['realizations','/realizacie/'],
            ['cfg-koverta','/konfigurator/?page=koverta'],
            ['cfg-carport','/konfigurator/?page=carport'],
            ['cfg-canopy','/konfigurator/?page=canopy'],
            ['cfg-bio','/konfigurator/?page=bio']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:proc.env.CHROME,args:['--no-sandbox','--disable-gpu']});
            for(const vp of [{w:1440,h:1000,n:'desktop'},{w:390,h:844,n:'mobile'}]){
              for(const [name,url] of routes){
                const ctx=await browser.newContext({viewport:{width:vp.w,height:vp.h}});
                const page=await ctx.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e)));
                await page.route('**/*',route=>{
                  const u=new URL(route.request().url());
                  if(u.hostname==='127.0.0.1'||u.hostname==='localhost') return route.continue();
                  return route.abort();
                });
                const resp=await page.goto('http://127.0.0.1:8911'+url,{waitUntil:'domcontentloaded',timeout:30000});
                if(!resp||!resp.ok()) throw new Error(`${name} ${vp.n} HTTP ${resp&&resp.status()}`);
                await page.waitForTimeout(500);
                const consent=page.getByRole('button',{name:/Iba nevyhnutné|Odmietnuť|Nevyhnutné/i}).first();
                if(await consent.count()) try{await consent.click({timeout:400})}catch{}
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                if(overflow>2) throw new Error(`${name} ${vp.n} horizontal overflow ${overflow}`);
                const localImgs=await page.locator('img[src]').evaluateAll(els=>[...new Set(els.map(el=>el.getAttribute('src')).filter(src=>src&&!/^https?:|^data:/.test(src)))])
                for(const src of localImgs){
                  const abs=new URL(src,page.url()).href; const r=await ctx.request.get(abs,{timeout:15000});
                  if(!r.ok()) throw new Error(`${name} broken local image ${src}: ${r.status()}`);
                }
                if(errors.length) throw new Error(`${name} ${vp.n} pageerror: ${errors.join(' | ')}`);
                if(name==='home'){
                  const steps=page.locator('[data-k-process] [data-k-step]'); if(await steps.count()!==5) throw new Error('home process step count drift');
                }
                if(name==='carport'){
                  const t=(await page.locator('#modely-carport').innerText()).replace(/\s+/g,' ');
                  for(const x of ['SL 170','SL 240','ISO panel 30 mm']) if(!t.includes(x)) throw new Error('carport missing '+x);
                  const g=(await page.locator('.kh-cat__grid').innerText()).replace(/\s+/g,' ');
                  if(g.includes('SL 170 pre jedno auto')) throw new Error('unverified SL170 gallery label remains');
                }
                if(name==='canopy'){
                  const t=await page.locator('#typy-prestresenia').innerText(); for(const x of ['F170','F240','G170','G240']) if(!t.includes(x)) throw new Error('canopy missing '+x);
                }
                if(name==='bio'){
                  if(await page.locator('section.kh-farby .kh-odtien').count()!==8) throw new Error('color swatch drift');
                }
                if(['home','carport','canopy','bio'].includes(name)){
                  const loc=name==='home'?page.locator('body'):name==='carport'?page.locator('#modely-carport'):name==='canopy'?page.locator('#typy-prestresenia'):page.locator('section.kh-farby');
                  await loc.screenshot({path:path.join(proc.env.GITHUB_WORKSPACE,'qa-final-site',`${name}-${vp.n}.png`)});
                }
                await ctx.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Run core configurator regressions
        shell: bash
        env:
          KV_URL: http://127.0.0.1:8912/konfigurator/?page=koverta
        run: |
          set -euo pipefail
          python3 -m http.server 8912 >/tmp/final-cfg-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS 'http://127.0.0.1:8912/konfigurator/?page=koverta' >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-site-pw/node_modules
          for t in pricing-logic osnova-podla-expivi technical-fidelity layout-smoke routing-smoke browser-qa; do
            echo "=== $t ==="
            node "konfigurator/test/$t.js"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-site-audit-${{ github.sha }}
          path: qa-final-site/*.png
          if-no-files-found: error

      - name: Commit validated correction and remove temporary audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- carport-soltec/index.html; then
            git add carport-soltec/index.html
            git commit -m 'fix: remove misleading SL170 gallery claim'
          fi
          git rm .github/workflows/tmp-final-site-audit-20260911.yml
          git commit -m 'ci: remove temporary final site audit'
          git push origin HEAD:fix/koverta-final-repair-20260910
