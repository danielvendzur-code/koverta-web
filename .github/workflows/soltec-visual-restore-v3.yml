name: Soltec visual restore v3

on:
  push:
    branches: [fix/soltec-louver-stability-20260910]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soltec-louver-stability-20260910
          fetch-depth: 0
      - name: Apply narrow visual restore
        run: |
          python3 .github/scripts/apply-soltec-visual-restore-v3.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('konfigurator/test/soltec-all-models-regression.js')
          s = p.read_text(encoding='utf-8')
          old = "  assert.match(source, /edge: model\\(\\)\\.kvGeom \\? o\\.edge !== false : o\\.edge === true/, 'Soltec structural faces must not receive synthetic outline strokes');\n"
          if old not in s:
              raise SystemExit('obsolete global edge assertion missing')
          s = s.replace(old, '', 1)
          old = "  assert.match(source, /boxFaces\\(x0, inY0, zTop - rd, w, inY1 - inY0, rd, hex, \\[\\], SHAFT, 0, false, true\\);/, 'Fixed Soltec secondary profiles must retain both end caps');"
          new = "  assert.match(source, /boxFaces\\(x0, inY0, zTop - rd, w, inY1 - inY0, rd, hex, \\[\\], SHAFT, 0, false, true, true\\);/, 'Fixed Soltec secondary profiles must retain both end caps and persist at grazing angles');"
          if old not in s:
              raise SystemExit('obsolete fixed-profile assertion missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax
        run: |
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/test/soltec-motion-regression.js
          node --check konfigurator/test/soltec-all-models-regression.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8901 >/tmp/soltec-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=bio' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soltec-http.log
          exit 1
      - name: Bioclimatic motion regression
        env:
          SOLTEC_URL: http://127.0.0.1:8901/konfigurator/?page=bio
        run: node konfigurator/test/soltec-motion-regression.js
      - name: All Soltec models regression
        env:
          SOLTEC_BASE_URL: http://127.0.0.1:8901/konfigurator/
        run: node konfigurator/test/soltec-all-models-regression.js
      - name: Koverta shared-renderer safety smoke
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: |
          node konfigurator/test/layout-smoke.js
          node konfigurator/test/stlpy-vidno.js
      - name: Commit verified renderer only
        run: |
          git config user.name 'danielvendzur-code'
          git config user.email 'daniel.vendzur@gmail.com'
          git rm .github/scripts/apply-soltec-visual-restore-v3.py .github/workflows/soltec-visual-restore-v3.yml
          git add konfigurator/soltec-premium.js konfigurator/test/soltec-all-models-regression.js
          git commit -m 'fix: restore Soltec visuals and persist structural profiles'
          git push origin HEAD:fix/soltec-louver-stability-20260910
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soltec-visual-restore-v3-evidence
          path: qa-artifacts
          if-no-files-found: ignore
