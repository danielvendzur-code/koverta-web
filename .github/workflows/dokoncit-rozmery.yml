name: Dokončiť rozmerové produktové stránky

on:
  push:
    branches: ['vendzur/gallant-euler-bkvsqa']
    paths:
      - '.github/workflows/dokoncit-rozmery.yml'

permissions:
  contents: write

jobs:
  dokoncit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendzur/gallant-euler-bkvsqa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Doplniť zdroj, vygenerovať stránky a Shopify tému
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/generuj-rozmery.py')
          text = generator.read_text(encoding='utf-8')

          script_tag = '<script src="../../../assets/rozmer-produkt.js" defer></script>'
          start = text.index("main = f'''")
          end = text.index('</main>', start)
          if script_tag not in text[start:end]:
              text = text[:end] + script_tag + '\n' + text[end:]

          seo_text = '''    <p class="k-copy" style="max-width:62ch"><strong>Kompletné riešenie na kľúč.</strong> Koverta je oceľový prístrešok vyrábaný na Slovensku. Súčasťou riešenia je nosná konštrukcia s povrchovou ochranou, strecha, integrované odvodnenie, doprava, odborná montáž a bezplatné zameranie. Rozmer upravíme podľa pozemku, parkovania alebo terasy a pripravíme cenovú ponuku pre realizáciu kdekoľvek na Slovensku.</p>
          '''
          marker = '    <div class="kh-hero__actions" style="margin:2rem 0">'
          if 'Kompletné riešenie na kľúč.' not in text:
              text = text.replace(marker, seo_text + '\n' + marker, 1)
          generator.write_text(text, encoding='utf-8')

          js = Path('assets/rozmer-produkt.js')
          code = js.read_text(encoding='utf-8')
          old = "const match = location.pathname.match(/\\/(pristresky-pre-auta|zahradne-pristresky)\\/rozmer\\/(\\d+)x(\\d+)\\/?$/);"
          new = """const match = location.pathname.match(/\\/(pristresky-pre-auta|zahradne-pristresky)\\/rozmer\\/(\\d+)x(\\d+)\\/?$/) ||
              location.pathname.match(/\\/pages\\/(?:nove-)?(pristresky-pre-auta|zahradne-pristresky)-rozmer-(\\d+)x(\\d+)\\/?$/);"""
          if old not in code:
              raise SystemExit('Nenašla sa cesta rozmerovej stránky v JS.')
          code = code.replace(old, new, 1)
          js.write_text(code, encoding='utf-8')
          PY

          python3 tools/generuj-rozmery.py
          node tools/spolocne-casti.js
          node tools/verzie-suborov.js
          node tools/shopify-tema.js

          node tools/spolocne-casti.js --kontrola
          node tools/shopify-tema.js --kontrola
          node tools/shopify-kontrola.js

      - name: Zapísať výsledok do PR vetvy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets shopify-tema tools pristresky-pre-auta zahradne-pristresky
          if git diff --cached --quiet; then
            echo "Bez zmien"
            exit 0
          fi
          git commit -m "feat: dokončiť SEO produktových stránok rozmerov"
          git push origin HEAD:vendzur/gallant-euler-bkvsqa
