name: Batch 5 header menu QA
# QA revision 3: deterministic Playwright timeouts

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch5-menu-20260911.yml

permissions:
  contents: write

jobs:
  batch5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply guarded menu redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-batch5-run.py
          git diff --check

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/koverta-b5-pw qa-batch5
          cd /tmp/koverta-b5-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1

      - name: Browser QA and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8906 >/tmp/koverta-b5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          export NODE_PATH=/tmp/koverta-b5-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node scripts/tmp-batch5-check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch5-menu-${{ github.sha }}
          path: qa-batch5/*.png
          if-no-files-found: error

      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/koverta-2026.css assets/koverta-2026.js
          git diff --name-only -- '*.html' | xargs -r git add
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          if printf '%s\n' "$staged" | grep -Ev '^(assets/koverta-2026\.(css|js)|.*\.html)$'; then
            echo 'Unexpected staged scope' >&2
            exit 1
          fi
          git commit -m 'feat: refine header navigation menu'
          git rm .github/workflows/tmp-batch5-menu-20260911.yml scripts/tmp-batch5-apply.py scripts/tmp-batch5-run.py scripts/tmp-batch5-check.js
          git commit -m 'ci: remove temporary batch 5 QA files'
          git push origin HEAD:fix/koverta-final-repair-20260910
