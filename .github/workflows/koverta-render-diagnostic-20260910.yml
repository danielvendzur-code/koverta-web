name: Koverta side-frame repair

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths:
      - .github/workflows/koverta-render-diagnostic-20260910.yml

permissions:
  contents: write

jobs:
  apply-validated-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Refuse concurrent branch movement
        run: |
          git fetch origin fix/koverta-final-repair-20260910 --depth=1
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch moved: expected $GITHUB_SHA, remote is $remote_sha" >&2
            exit 1
          }
      - name: Apply validated physical occlusion fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('konfigurator/soltec-premium.js')
          s = p.read_text(encoding='utf-8')
          old = "const n = axis === 'x' ? [dz, 0, -da] : [0, dz, -da];"
          new = """const n = axis === 'x' ? [dz, 0, -da] : [0, dz, -da];
                /* The exterior web of both side perimeter C-rails sits 18 mm
                   behind the opaque side fascia. It is permanently occluded in
                   the real assembly, so do not emit that invisible zinc plane:
                   keeping it in BSP made it leak through fascia split edges. */
                const outsideA = single > 0 ? 0 : par;
                if (podStrechou && axis === 'y' && single &&
                    Math.abs(A[0] - outsideA) < 1e-6 && Math.abs(B[0] - outsideA) < 1e-6) continue;"""
          if s.count(old) != 1:
              raise SystemExit(f'c-profile marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check konfigurator/soltec-premium.js
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "konfigurator/soltec-premium.js" || {
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          if git diff --name-only | grep -E '(^|/)(archiv-expivi|konfigurator/test|coordination/koverta|assets/mapa/reca\.jpg)' >/dev/null; then
            echo 'Forbidden scope touched' >&2
            exit 1
          fi
      - name: Commit repair
        run: |
          git config user.name 'koverta-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add konfigurator/soltec-premium.js
          git commit -m 'fix: hide occluded Koverta side-frame webs'
          git push origin HEAD:fix/koverta-final-repair-20260910
