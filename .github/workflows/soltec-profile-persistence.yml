name: Verify Soltec perimeter profile persistence

on:
  push:
    branches: [fix/soltec-louver-stability-20260910]

concurrency:
  group: soltec-profile-persistence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soltec-louver-stability-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply profile persistence patch
        run: python3 .github/scripts/apply-soltec-profile-persistence.py
      - name: Syntax check
        run: |
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/test/soltec-motion-regression.js
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/soltec-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=bio' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soltec-http.log
          exit 1
      - name: Soltec motion and rim regression
        env:
          SOLTEC_URL: http://127.0.0.1:8901/konfigurator/?page=bio
        run: node konfigurator/test/soltec-motion-regression.js
      - name: Capture low-angle rim orbit
        run: |
          mkdir -p qa-artifacts/soltec-rim
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:980},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8901/konfigurator/?page=bio',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => window.SP_TEST && window.SP_TEST.setView && document.querySelector('#SoltecPremium [data-sp-canvas] polygon'));
            const stage = page.locator('#SoltecPremium .sp-stage');
            await stage.scrollIntoViewIfNeeded();
            await page.evaluate(() => {
              const r=document.querySelector('#SoltecPremium [data-sp-louver-range]');
              r.value='0'; r.dispatchEvent(new Event('input',{bubbles:true}));
            });
            for (let i=0;i<16;i++) {
              const az=-Math.PI + (2*Math.PI*i)/16;
              await page.evaluate((a)=>{window.SP_TEST.setView(a,-0.18);window.SP_TEST.redrawStage();},az);
              await stage.screenshot({path:`qa-artifacts/soltec-rim/rim-${String(i).padStart(2,'0')}.png`});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: soltec-rim-profile-orbit
          path: qa-artifacts/soltec-rim
          if-no-files-found: error
      - name: Commit verified profile fix only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add konfigurator/soltec-premium.js konfigurator/test/soltec-motion-regression.js
          git rm .github/scripts/apply-soltec-profile-persistence.py .github/workflows/soltec-profile-persistence.yml
          git commit -m 'fix: keep Soltec perimeter profiles visible through orbit'
          git push origin HEAD:fix/soltec-louver-stability-20260910
