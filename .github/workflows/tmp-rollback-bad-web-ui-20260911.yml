name: Roll back bad web UI/content layer

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-rollback-bad-web-ui-20260911.yml

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore only web/content files to last pre-regression state
        shell: bash
        run: |
          set -euo pipefail
          SAFE=545390c1147b2927242ad4b5ca493e787c8fc620
          git cat-file -e "$SAFE^{commit}"
          git checkout "$SAFE" -- \
            index.html \
            pristresky-pre-auta/index.html \
            zahradne-pristresky/index.html \
            carport-soltec/index.html \
            bioklimaticke-pergoly/index.html \
            pevne-prestresenia/index.html \
            tienenie/index.html \
            outdoor-kuchyne/index.html \
            assets/koverta-2026.css \
            assets/koverta-2026.js \
            assets/koverta-sketch-carport.svg

          # Never touch configurator/runtime files in this rollback.
          test -z "$(git diff --name-only -- konfigurator)"
          git diff --check

          changed="$(git diff --name-only)"
          echo "$changed"
          for f in $changed; do
            case "$f" in
              index.html|pristresky-pre-auta/index.html|zahradne-pristresky/index.html|carport-soltec/index.html|bioklimaticke-pergoly/index.html|pevne-prestresenia/index.html|tienenie/index.html|outdoor-kuchyne/index.html|assets/koverta-2026.css|assets/koverta-2026.js|assets/koverta-sketch-carport.svg) ;;
              *) echo "Unexpected rollback scope: $f" >&2; exit 1 ;;
            esac
          done

      - name: Commit rollback and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            index.html \
            pristresky-pre-auta/index.html \
            zahradne-pristresky/index.html \
            carport-soltec/index.html \
            bioklimaticke-pergoly/index.html \
            pevne-prestresenia/index.html \
            tienenie/index.html \
            outdoor-kuchyne/index.html \
            assets/koverta-2026.css \
            assets/koverta-2026.js \
            assets/koverta-sketch-carport.svg
          git commit -m 'revert: restore stable web UI before content regressions'
          git rm .github/workflows/tmp-rollback-bad-web-ui-20260911.yml
          git commit -m 'ci: remove temporary rollback workflow'
          git push origin HEAD:fix/koverta-final-repair-20260910
