name: Koverta internal-line owner diagnostic

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths:
      - .github/workflows/koverta-edge-owner-20260910.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Instrument checkout only
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('konfigurator/soltec-premium.js')
          s=p.read_text(encoding='utf-8')
          width={'baseline':'0.7'}[os.environ['VARIANT']]
          old_seal="stroke: f.fill, 'stroke-width': '0.7', 'stroke-linecap': 'butt'"
          new_seal=f"stroke: f.fill, 'stroke-width': '{width}', 'stroke-linecap': 'butt', 'data-dbg-internal-seal': '1', 'data-dbg-order': String(f.order), 'data-dbg-world': f.w.map((q) => q.map((v) => Number(v).toFixed(2)).join(',')).join(';')"
          if s.count(old_seal)!=1: raise SystemExit(f'seal marker count={s.count(old_seal)}')
          s=s.replace(old_seal,new_seal,1)
          old="            const a = { points: pts, fill: f.fill };"
          new="            const a = { points: pts, fill: f.fill, 'data-dbg-world': f.w.map((q) => q.map((v) => Number(v).toFixed(2)).join(',')).join(';'), 'data-dbg-source': (f.sourceW || f.w).map((q) => q.map((v) => Number(v).toFixed(2)).join(',')).join(';'), 'data-dbg-order': String(f.order), 'data-dbg-depth': Number(f.depthAvg).toFixed(3), 'data-dbg-edge': String(Boolean(f.edge)), 'data-dbg-seal': String(Boolean(f.sealSplits)) };"
          if s.count(old)!=1: raise SystemExit(f'paint marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check konfigurator/soltec-premium.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=koverta' >/dev/null && exit 0; sleep 1; done
          cat /tmp/koverta-http.log; exit 1
      - name: Identify side-view pixel owners
        run: |
          cat > edge-owner-diagnostic.js <<'JS'
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          const URL='http://127.0.0.1:8901/konfigurator/?page=koverta';
          async function gotoControl(page,selector){const c=page.locator(selector).first();await c.waitFor({state:'attached'});const step=await c.evaluate(el=>{const h=el.closest('[data-sp-stepno]');return h?Number(h.dataset.spStepno):null});if(step!=null){await page.locator(`[data-sp-goto="${step}"]`).click();await page.waitForTimeout(80)}}
          async function enableExtra(page,id){await gotoControl(page,'[data-sp-add-on="x-kv"]');const group=page.locator('[data-sp-add-on="x-kv"]').first();if(!await group.isChecked()){await group.locator('xpath=ancestor::label[1]').click();await page.waitForTimeout(100)}const plus=page.locator(`[data-sp-x="${id}"][data-sp-xd="1"]`).first();await plus.waitFor({state:'visible'});await plus.click();await page.waitForTimeout(180)}
          async function setSize(page,w,l){await gotoControl(page,'[data-sp-w]');await page.evaluate(({w,l})=>{for(const [sel,v] of [['[data-sp-w]',w],['[data-sp-l]',l]]){const el=document.querySelector(sel);el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}))}},{w,l});await page.waitForTimeout(240)}
          (async()=>{fs.mkdirSync('diagnostic',{recursive:true});const browser=await chromium.launch({args:['--no-sandbox']});const ctx=await browser.newContext({viewport:{width:1440,height:1000}});const page=await ctx.newPage();await page.goto(URL,{waitUntil:'load',timeout:60000});const reject=page.getByRole('button',{name:'Iba nevyhnutné'});if(await reject.count())await reject.first().click();await page.waitForFunction(()=>Boolean(window.SP_TEST&&document.querySelector('[data-sp-canvas] polygon')));await enableExtra(page,'kv-izol');await enableExtra(page,'kv-led');await setSize(page,7000,6000);await page.locator('[data-sp-view="side"]').click();await page.waitForTimeout(300);const stage=page.locator('.sp-stage');await stage.screenshot({path:'diagnostic/side.png'});const result=await page.evaluate(()=>{const stage=document.querySelector('.sp-stage');const r=stage.getBoundingClientRect();const targets=[[157,168],[162,168],[182,168],[286,168],[310,169],[310,175],[310,180],[452,167],[510,167],[533,167],[630,167],[653,167]];const polys=[...document.querySelectorAll('[data-sp-canvas] polygon')];const lines=[...document.querySelectorAll('[data-sp-canvas] line[data-dbg-internal-seal]')];const hit=(el,sx,sy)=>{try{const m=el.getScreenCTM();if(!m||typeof el.isPointInFill!=='function')return false;const p=new DOMPoint(sx,sy).matrixTransform(m.inverse());return el.isPointInFill(p)}catch(e){return false}};const near=(el,sx,sy)=>{const m=el.getScreenCTM();if(!m)return false;const a=new DOMPoint(Number(el.getAttribute('x1')),Number(el.getAttribute('y1'))).matrixTransform(m);const b=new DOMPoint(Number(el.getAttribute('x2')),Number(el.getAttribute('y2'))).matrixTransform(m);const ux=b.x-a.x,uy=b.y-a.y,l2=ux*ux+uy*uy||1;const t=Math.max(0,Math.min(1,((sx-a.x)*ux+(sy-a.y)*uy)/l2));return Math.hypot(sx-(a.x+ux*t),sy-(a.y+uy*t))<=1.5};return targets.map(([lx,ly])=>{const sx=r.left+lx,sy=r.top+ly;const hits=polys.filter(p=>hit(p,sx,sy)).map(p=>({domIndex:polys.indexOf(p),fill:p.getAttribute('fill'),stroke:p.getAttribute('stroke'),world:p.getAttribute('data-dbg-world'),source:p.getAttribute('data-dbg-source'),order:p.getAttribute('data-dbg-order'),depth:p.getAttribute('data-dbg-depth'),edge:p.getAttribute('data-dbg-edge'),seal:p.getAttribute('data-dbg-seal')}));const seals=lines.filter(l=>near(l,sx,sy)).map(l=>({domIndex:[...l.parentNode.children].indexOf(l),stroke:l.getAttribute('stroke'),order:l.getAttribute('data-dbg-order'),world:l.getAttribute('data-dbg-world')}));return{local:[lx,ly],hits:hits.slice(-20),seals:seals.slice(-20)}})});const markup=await page.locator('[data-sp-canvas]').evaluate(el=>el.outerHTML);fs.writeFileSync('diagnostic/side-owners.json',JSON.stringify(result,null,2));fs.writeFileSync('diagnostic/side.svg',markup);console.log(JSON.stringify(result,null,2));await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node edge-owner-diagnostic.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koverta-internal-line-owner
          path: diagnostic
          if-no-files-found: error
