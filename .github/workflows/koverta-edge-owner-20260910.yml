name: Koverta roof flashing edge diagnostic

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths:
      - .github/workflows/koverta-edge-owner-20260910.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [front-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checkout-only physical variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('konfigurator/soltec-premium.js')
          s=p.read_text(encoding='utf-8')
          v=os.environ['VARIANT']
          old_turn="""              const turnBottom = trapBot - 1;
              put(zav - 9 * dir, zav + 10 * dir, turnBottom, zTop - turnBottom);"""
          old_bounds="""            const vx0 = Math.max(tx0, LEM_CELO + 11), vx1 = Math.min(tx1, L - LEM_CELO - 11);
            const vy0 = Math.max(ty0, LEM_BOK + 11), vy1 = Math.min(ty1, W - LEM_BOK - 11);"""
          if v in ('thin-turn-butt','thin-turn-gap'):
              new_turn="""              const turnBottom = trapBot - 1;
              /* Diagnostic: the inner return is the same 1.5 mm folded sheet as
                 the top flashing arm on the front/rear pieces. Side pieces stay
                 unchanged so this isolates the exposed transverse sheet cut. */
              if (axis === 'x') put(zav, zav + LEM_ARM * dir, turnBottom, zTop - turnBottom);
              else put(zav - 9 * dir, zav + 10 * dir, turnBottom, zTop - turnBottom);"""
              off='LEM_ARM' if v=='thin-turn-butt' else '(LEM_ARM + 1)'
              new_bounds=f"""            const vx0 = Math.max(tx0, LEM_CELO + {off}), vx1 = Math.min(tx1, L - LEM_CELO - {off});
            const vy0 = Math.max(ty0, LEM_BOK + 11), vy1 = Math.min(ty1, W - LEM_BOK - 11);"""
              if s.count(old_turn)!=1: raise SystemExit(f'turn marker count={s.count(old_turn)}')
              if s.count(old_bounds)!=1: raise SystemExit(f'bounds marker count={s.count(old_bounds)}')
              s=s.replace(old_turn,new_turn,1).replace(old_bounds,new_bounds,1)
          elif v=='front-arm':
              old_arm="""              put(outer, outer + sirka * dir, zTop - LEM_ARM, LEM_ARM, true);  // horné rameno"""
              new_arm="""              /* Diagnostic: extend the existing folded arm across the
                 11 mm pocket and lap the sheet by its 1.5 mm thickness. */
              const topReach = sirka + (axis === 'x' ? 11 + LEM_ARM : 0);
              put(outer, outer + topReach * dir, zTop - LEM_ARM, LEM_ARM, true);  // horné rameno"""
              old_post="""                const r = Math.max(4, Math.round(Math.min(pd, pw) * 0.05));"""
              old_seg="""                const SEG = 2;"""
              if s.count(old_arm)!=1: raise SystemExit(f'arm marker count={s.count(old_arm)}')
              if s.count(old_post)!=1: raise SystemExit(f'post marker count={s.count(old_post)}')
              if s.count(old_seg)!=1: raise SystemExit(f'segment marker count={s.count(old_seg)}')
              s=s.replace(old_arm,new_arm,1)
              s=s.replace(old_post,"                const r = Math.max(3, Math.round(Math.min(pd, pw) * 0.035));",1)
              s=s.replace(old_seg,"                const SEG = 1;",1)
          elif v!='baseline':
              raise SystemExit('unknown variant')
          p.write_text(s,encoding='utf-8')
          PY
          node --check konfigurator/soltec-premium.js
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=koverta' >/dev/null && exit 0; sleep 1; done
          cat /tmp/koverta-http.log; exit 1
      - name: Render identical QA views
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: node konfigurator/test/koverta-accessories.js
      - name: Keep comparison evidence
        if: always()
        run: |
          mkdir -p diagnostic
          find qa-artifacts -maxdepth 1 -type f \( -name 'koverta-accessories-front-7000x6000-desktop.png' -o -name 'koverta-accessories-side-7000x6000-desktop.png' -o -name 'koverta-accessories-corner-7000x6000-desktop.png' -o -name 'koverta-accessories-under-7000x6000-desktop.png' \) -exec cp {} diagnostic/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koverta-roof-edge-${{ matrix.variant }}
          path: diagnostic
          if-no-files-found: error
