# Diagnostika koverta.sk (len čítanie)
#
# Z runnera stiahne úvodnú stránku obchodu a vypíše, čo je v <head>
# (skripty, štýly, preloady — vlastné aj Shopify a aplikácií), a z Lighthouse
# sieťové požiadavky, render-blocking zdroje a cudzí kód. Nič nemení
# a nič nenasadzuje; slúži na hľadanie brzdy LCP v živom obchode.
name: Diagnostika produkcie

on:
  workflow_dispatch:
    inputs:
      adresa:
        description: Adresa
        required: true
        default: https://koverta.sk/
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: [.github/workflows/diagnostika-produkcie.yml]

permissions:
  contents: read

jobs:
  diagnostika:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML hlavičky
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          curl -sSL -A 'Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36' "$ADRESA" -o stranka.html
          echo "HTML bajtov: $(wc -c < stranka.html), gzip: $(gzip -9c stranka.html | wc -c)"
          node -e '
            const t = require("fs").readFileSync("stranka.html", "utf8");
            const hlava = t.slice(0, t.indexOf("</head>"));
            console.log("HEAD bajtov:", hlava.length);
            const re = /<(script|link|style)\b[^>]*>/gi; let m, i = 0;
            while ((m = re.exec(hlava))) {
              const tag = m[0];
              let info = tag.replace(/\s+/g, " ").slice(0, 230);
              if (m[1].toLowerCase() !== "link" && !/\bsrc=/.test(tag)) {
                const koniec = hlava.indexOf("</" + m[1], m.index);
                info += " [inline " + (koniec - m.index) + " B]";
              }
              console.log("HEAD " + String(++i).padStart(3) + " @" + m.index + " " + info);
            }
            const telo = t.slice(t.indexOf("</head>"));
            const sk = [...telo.matchAll(/<script\b[^>]*\bsrc="([^"]+)"[^>]*>/gi)].map((x) => x[0].replace(/\s+/g, " ").slice(0, 200));
            sk.forEach((x) => console.log("BODY " + x));
            console.log("BODY inline skriptov:", (telo.match(/<script\b(?![^>]*\bsrc=)[^>]*>/gi) || []).length);
          '
      - name: Stav po upratani pixelov — 5x mobil, rozpad blokovania podla zdroja (len meranie)
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          npm install --no-save lighthouse@12 >/dev/null 2>&1
          for i in 1 2 3 4 5; do npx lighthouse "$ADRESA" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="s-$i.json" || true; done
          node -e '
            const fs = require("fs");
            const x = [1, 2, 3, 4, 5].map((i) => `s-${i}.json`).filter(fs.existsSync).map((f) => JSON.parse(fs.readFileSync(f, "utf8")));
            const m = x.map((r) => ({ p: Math.round(r.categories.performance.score * 100), fcp: Math.round(r.audits["first-contentful-paint"].numericValue), lcp: Math.round(r.audits["largest-contentful-paint"].numericValue), tbt: Math.round(r.audits["total-blocking-time"].numericValue), si: Math.round(r.audits["speed-index"].numericValue), o: r.audits.metrics.details.items[0].observedLargestContentfulPaint }));
            const med = (k) => m.map((y) => y[k]).sort((a, b) => a - b)[Math.floor(m.length / 2)];
            console.log("STAV behy " + m.map((y) => `${y.p}/${y.lcp}/${y.tbt}/o${y.o}`).join(" ") + ` | MEDIAN perf ${med("p")} fcp ${med("fcp")} lcp ${med("lcp")} tbt ${med("tbt")} si ${med("si")}`);
            const r = x[Math.floor(x.length / 2)];
            for (const it of (r.audits["bootup-time"].details.items || []).slice(0, 25)) console.log("CPU", Math.round(it.total), Math.round(it.scripting), it.url.slice(0, 150));
            for (const it of (r.audits["third-party-summary"].details?.items || [])) console.log("3P", it.entity, Math.round(it.blockingTime), Math.round(it.mainThreadTime), Math.round(it.transferSize / 1024) + "kB");
            for (const it of (r.audits["network-requests"].details.items || [])) if (/script/i.test(it.resourceType)) console.log("JS", Math.round(it.transferSize / 1024) + "kB", it.url.slice(0, 150));
            for (const it of (r.audits["long-tasks"]?.details?.items || []).slice(0, 20)) console.log("LT", Math.round(it.startTime), Math.round(it.duration), it.url.slice(0, 150));
          '
