# Diagnostika koverta.sk (len čítanie)
#
# Z runnera stiahne úvodnú stránku obchodu a vypíše, čo je v <head>
# (skripty, štýly, preloady — vlastné aj Shopify a aplikácií), a z Lighthouse
# sieťové požiadavky, render-blocking zdroje a cudzí kód. Nič nemení
# a nič nenasadzuje; slúži na hľadanie brzdy LCP v živom obchode.
name: Diagnostika produkcie

on:
  workflow_dispatch:
    inputs:
      adresa:
        description: Adresa
        required: true
        default: https://koverta.sk/
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: [.github/workflows/diagnostika-produkcie.yml]

permissions:
  contents: read

jobs:
  diagnostika:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML hlavičky
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          curl -sSL -A 'Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36' "$ADRESA" -o stranka.html
          echo "HTML bajtov: $(wc -c < stranka.html), gzip: $(gzip -9c stranka.html | wc -c)"
          node -e '
            const t = require("fs").readFileSync("stranka.html", "utf8");
            const hlava = t.slice(0, t.indexOf("</head>"));
            console.log("HEAD bajtov:", hlava.length);
            const re = /<(script|link|style)\b[^>]*>/gi; let m, i = 0;
            while ((m = re.exec(hlava))) {
              const tag = m[0];
              let info = tag.replace(/\s+/g, " ").slice(0, 230);
              if (m[1].toLowerCase() !== "link" && !/\bsrc=/.test(tag)) {
                const koniec = hlava.indexOf("</" + m[1], m.index);
                info += " [inline " + (koniec - m.index) + " B]";
              }
              console.log("HEAD " + String(++i).padStart(3) + " @" + m.index + " " + info);
            }
            const telo = t.slice(t.indexOf("</head>"));
            const sk = [...telo.matchAll(/<script\b[^>]*\bsrc="([^"]+)"[^>]*>/gi)].map((x) => x[0].replace(/\s+/g, " ").slice(0, 200));
            sk.forEach((x) => console.log("BODY " + x));
            console.log("BODY inline skriptov:", (telo.match(/<script\b(?![^>]*\bsrc=)[^>]*>/gi) || []).length);
          '
      - name: Scenáre na živom koverta.sk (blokované URL = len meranie, nič sa nemení)
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          npm install --no-save lighthouse@12 >/dev/null 2>&1
          meraj() { for i in 1 2 3 4 5; do npx lighthouse "$ADRESA" --quiet --chrome-flags="--headless=new --no-sandbox" $2 --output=json --output-path="s-$1-$i.json" || true; done; }
          meraj a-teraz ""
          meraj b-bez-ezterms-css "--blocked-url-patterns=*ez-terms-and-conditions-checkbox*style.min.css*"
          meraj c-bez-ga-migrated "--blocked-url-patterns=*id=G-0NHPFNEHKX*"
          meraj d-bez-gy-pixel "--blocked-url-patterns=*id=GT-WB74C64*"
          meraj e-bez-consentik "--blocked-url-patterns=*consentik*"
          node -e '
            const fs = require("fs");
            for (const v of ["a-teraz", "b-bez-ezterms-css", "c-bez-ga-migrated", "d-bez-gy-pixel", "e-bez-consentik"]) {
              const x = [1, 2, 3, 4, 5].map((i) => `s-${v}-${i}.json`).filter(fs.existsSync).map((f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { return null; } }).filter((r) => r && r.categories);
              const a = (r, k) => Math.round((r.audits[k] || {}).numericValue);
              const m = x.map((r) => ({ p: Math.round(r.categories.performance.score * 100), fcp: a(r, "first-contentful-paint"), lcp: a(r, "largest-contentful-paint"), tbt: a(r, "total-blocking-time"), si: a(r, "speed-index"), o: r.audits.metrics?.details?.items?.[0]?.observedLargestContentfulPaint }));
              const med = (k) => m.map((y) => y[k]).sort((a, b) => a - b)[Math.floor(m.length / 2)];
              console.log(`SCENAR ${v.padEnd(20)} ` + m.map((y) => `${y.p}/${y.lcp}/${y.tbt}/o${y.o}`).join(" ") + ` | MEDIAN perf ${med("p")} fcp ${med("fcp")} lcp ${med("lcp")} tbt ${med("tbt")} si ${med("si")}`);
              if (v === "a-teraz" && x.length) { const r = x[0]; for (const k of ["render-blocking-resources", "largest-contentful-paint-element"]) console.log("  " + k, JSON.stringify(r.audits[k]?.details?.items || "").slice(0, 900)); }
            }
          '
