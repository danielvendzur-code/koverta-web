# Diagnostika koverta.sk (len čítanie)
#
# Z runnera stiahne úvodnú stránku obchodu a vypíše, čo je v <head>
# (skripty, štýly, preloady — vlastné aj Shopify a aplikácií), a z Lighthouse
# sieťové požiadavky, render-blocking zdroje a cudzí kód. Nič nemení
# a nič nenasadzuje; slúži na hľadanie brzdy LCP v živom obchode.
name: Diagnostika produkcie

on:
  workflow_dispatch:
    inputs:
      adresa:
        description: Adresa
        required: true
        default: https://koverta.sk/
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: [.github/workflows/diagnostika-produkcie.yml]

permissions:
  contents: read

jobs:
  diagnostika:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML hlavičky
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          curl -sSL -A 'Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36' "$ADRESA" -o stranka.html
          echo "HTML bajtov: $(wc -c < stranka.html), gzip: $(gzip -9c stranka.html | wc -c)"
          node -e '
            const t = require("fs").readFileSync("stranka.html", "utf8");
            const hlava = t.slice(0, t.indexOf("</head>"));
            console.log("HEAD bajtov:", hlava.length);
            const re = /<(script|link|style)\b[^>]*>/gi; let m, i = 0;
            while ((m = re.exec(hlava))) {
              const tag = m[0];
              let info = tag.replace(/\s+/g, " ").slice(0, 230);
              if (m[1].toLowerCase() !== "link" && !/\bsrc=/.test(tag)) {
                const koniec = hlava.indexOf("</" + m[1], m.index);
                info += " [inline " + (koniec - m.index) + " B]";
              }
              console.log("HEAD " + String(++i).padStart(3) + " @" + m.index + " " + info);
            }
            const telo = t.slice(t.indexOf("</head>"));
            const sk = [...telo.matchAll(/<script\b[^>]*\bsrc="([^"]+)"[^>]*>/gi)].map((x) => x[0].replace(/\s+/g, " ").slice(0, 200));
            sk.forEach((x) => console.log("BODY " + x));
            console.log("BODY inline skriptov:", (telo.match(/<script\b(?![^>]*\bsrc=)[^>]*>/gi) || []).length);
          '
      - name: Strop témy — koverta.sk s blokovanými skupinami skriptov (len meranie)
        env:
          ADRESA: ${{ inputs.adresa || 'https://koverta.sk/' }}
        run: |
          npm install --no-save lighthouse@12 >/dev/null 2>&1
          GOOGLE='--blocked-url-patterns=*googletagmanager.com* --blocked-url-patterns=*google-analytics.com* --blocked-url-patterns=*googleadservices.com* --blocked-url-patterns=*doubleclick.net* --blocked-url-patterns=*merchant-center-analytics.goog*'
          FB='--blocked-url-patterns=*facebook.net* --blocked-url-patterns=*facebook.com*'
          SHOP='--blocked-url-patterns=*/cdn/wpm/* --blocked-url-patterns=*/web-pixels* --blocked-url-patterns=*trekkie* --blocked-url-patterns=*perf-kit* --blocked-url-patterns=*shop-js* --blocked-url-patterns=*shop_events_listener* --blocked-url-patterns=*shop.app* --blocked-url-patterns=*shopifysvc.com* --blocked-url-patterns=*/checkouts/internal/preloads.js* --blocked-url-patterns=*load_feature* --blocked-url-patterns=*origin_trials* --blocked-url-patterns=*standard-actions* --blocked-url-patterns=*monorail*'
          APPS='--blocked-url-patterns=*consentik* --blocked-url-patterns=*ez-terms* --blocked-url-patterns=*expivi.com* --blocked-url-patterns=*omegatheme.com* --blocked-url-patterns=*geojs.io* --blocked-url-patterns=*cloudflare.com/cdn-cgi*'
          meraj() { for i in 1 2 3; do npx lighthouse "$ADRESA" --quiet --chrome-flags="--headless=new --no-sandbox" $2 --output=json --output-path="s-$1-$i.json" || true; done; }
          meraj nic ""
          meraj google "$GOOGLE"
          meraj fb "$FB"
          meraj shop "$SHOP"
          meraj apps "$APPS"
          meraj vsetko "$GOOGLE $FB $SHOP $APPS"
          node -e '
            const fs = require("fs");
            for (const v of ["nic", "google", "fb", "shop", "apps", "vsetko"]) {
              const x = [1, 2, 3].map((i) => `s-${v}-${i}.json`).filter(fs.existsSync).map((f) => JSON.parse(fs.readFileSync(f, "utf8"))).map((r) => ({ p: Math.round(r.categories.performance.score * 100), fcp: Math.round(r.audits["first-contentful-paint"].numericValue), lcp: Math.round(r.audits["largest-contentful-paint"].numericValue), tbt: Math.round(r.audits["total-blocking-time"].numericValue), si: Math.round(r.audits["speed-index"].numericValue), olcp: r.audits.metrics.details.items[0].observedLargestContentfulPaint }));
              const med = (k) => x.map((y) => y[k]).sort((a, b) => a - b)[Math.floor(x.length / 2)];
              console.log(`STROP ${v.padEnd(7)} behy ` + x.map((y) => `${y.p}/${y.lcp}/${y.tbt}/o${y.olcp}`).join(" ") + ` | MEDIAN perf ${med("p")} fcp ${med("fcp")} lcp ${med("lcp")} tbt ${med("tbt")} si ${med("si")}`);
            }
          '
