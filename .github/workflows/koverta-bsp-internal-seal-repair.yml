name: Koverta guarded final render repair

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded renderer repair
        run: |
          python3 .github/koverta-final-render-repair.py
          node --check konfigurator/soltec-premium.js
          git diff --check
          test "$(git diff --name-only)" = "konfigurator/soltec-premium.js"
          git diff --exit-code -- archiv-expivi konfigurator/test coordination/koverta assets/mapa/reca.jpg
      - name: Commit renderer only
        run: |
          if git diff --quiet -- konfigurator/soltec-premium.js; then
            echo "No renderer change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add konfigurator/soltec-premium.js
          git commit -m "fix: finish Koverta render surfaces"
          git push origin HEAD:fix/koverta-final-repair-20260910
