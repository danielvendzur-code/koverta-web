name: Koverta guarded internal BSP seam repair

on:
  push:
    branches: [fix/koverta-final-repair-20260910]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch only internal BSP raster seams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('konfigurator/soltec-premium.js')
          s = p.read_text(encoding='utf-8')

          old_fragment = """            return Object.assign({}, face, {
              w,
              p,
              depthAvg: depths.reduce((sum, value) => sum + value, 0) / depths.length,"""
          new_fragment = """            return Object.assign({}, face, {
              w,
              p,
              /* Preserve the root polygon before the first BSP split. Final
                 fragments can then distinguish a real product edge from an
                 artificial clipping edge without changing BSP tolerances. */
              sourceW: face.sourceW || face.w.map((point) => point.slice()),
              depthAvg: depths.reduce((sum, value) => sum + value, 0) / depths.length,"""

          old_paint = """          const podklad = faces.filter((f) => f.bg);
          const stavba = faces.filter((f) => !f.bg);
          bspPaintOrder(podklad).concat(bspPaintOrder(stavba)).forEach((f) => {
            const pts = f.p.map((q) => (q.x * scale + ox).toFixed(2) + ',' + (q.y * scale + oy).toFixed(2)).join(' ');
            const a = { points: pts, fill: f.fill };
            /* Two anti-aliased faces sharing an edge leave a hairline of
               background between them. Stroking each face in its own colour
               closes it; the corner still reads, because the two sides are
               genuinely lit differently. */
            if (f.edge) { a.stroke = f.edgeCol; a['stroke-width'] = '0.7'; a['stroke-linejoin'] = 'round'; }
            if (f.seamless) a['shape-rendering'] = 'crispEdges';
            g.appendChild(svgEl('polygon', a));
          });"""

          new_paint = """          const podklad = faces.filter((f) => f.bg);
          const stavba = faces.filter((f) => !f.bg);

          /* A Koverta roof facet deliberately has edge:false so its real
             perimeter can never bleed over the flashing. BSP clipping creates
             new edges inside that facet, though, and those artificial edges
             still need a sub-pixel seal. Classify final fragment edges against
             the untouched root polygon and seal only edges that did not exist
             on that source polygon. This changes no geometry, depth ordering or
             BSP tolerance and cannot close the drainage/profile perimeter. */
          const pointOnSourceSegment = (p, a, b) => {
            const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
            const len2 = ux * ux + uy * uy + uz * uz;
            if (len2 <= BSP_EPS * BSP_EPS) return false;
            const vx = p[0] - a[0], vy = p[1] - a[1], vz = p[2] - a[2];
            const t = (vx * ux + vy * uy + vz * uz) / len2;
            if (t < -1e-10 || t > 1 + 1e-10) return false;
            const qx = a[0] + ux * t, qy = a[1] + uy * t, qz = a[2] + uz * t;
            return Math.hypot(p[0] - qx, p[1] - qy, p[2] - qz) <= BSP_EPS;
          };
          const edgeBelongsToSource = (a, b, source) => {
            if (!Array.isArray(source) || source.length < 3) return true;
            for (let i = 0; i < source.length; i++) {
              const u = source[i], v = source[(i + 1) % source.length];
              if (pointOnSourceSegment(a, u, v) && pointOnSourceSegment(b, u, v)) return true;
            }
            return false;
          };
          const internalSplitEdges = (f) => {
            if (!model().kvGeom || f.edge || !f.seamless || !Array.isArray(f.sourceW)) return [];
            const out = [];
            for (let i = 0; i < f.w.length; i++) {
              const j = (i + 1) % f.w.length;
              if (!edgeBelongsToSource(f.w[i], f.w[j], f.sourceW)) out.push([f.p[i], f.p[j]]);
            }
            return out;
          };

          bspPaintOrder(podklad).concat(bspPaintOrder(stavba)).forEach((f) => {
            const pts = f.p.map((q) => (q.x * scale + ox).toFixed(2) + ',' + (q.y * scale + oy).toFixed(2)).join(' ');
            const a = { points: pts, fill: f.fill };
            /* Two anti-aliased faces sharing an edge leave a hairline of
               background between them. Stroking each face in its own colour
               closes it; the corner still reads, because the two sides are
               genuinely lit differently. */
            if (f.edge) { a.stroke = f.edgeCol; a['stroke-width'] = '0.7'; a['stroke-linejoin'] = 'round'; }
            if (f.seamless) a['shape-rendering'] = 'crispEdges';
            g.appendChild(svgEl('polygon', a));
            internalSplitEdges(f).forEach((edge) => {
              const u = edge[0], v = edge[1];
              g.appendChild(svgEl('line', {
                x1: (u.x * scale + ox).toFixed(2), y1: (u.y * scale + oy).toFixed(2),
                x2: (v.x * scale + ox).toFixed(2), y2: (v.y * scale + oy).toFixed(2),
                stroke: f.fill, 'stroke-width': '0.7', 'stroke-linecap': 'butt',
                'shape-rendering': 'crispEdges'
              }));
            });
          });"""

          marker = 'const internalSplitEdges = (f) => {'
          if marker in s:
              print('Internal BSP seam repair already present.')
          else:
              if s.count(old_fragment) != 1:
                  raise SystemExit(f'faceFragment guard count={s.count(old_fragment)}')
              if s.count(old_paint) != 1:
                  raise SystemExit(f'paint guard count={s.count(old_paint)}')
              s = s.replace(old_fragment, new_fragment, 1)
              s = s.replace(old_paint, new_paint, 1)
              p.write_text(s, encoding='utf-8')
          PY
          node --check konfigurator/soltec-premium.js
          git diff --check
          git diff --exit-code -- archiv-expivi konfigurator/test coordination/koverta assets/mapa/reca.jpg
      - name: Commit renderer only
        run: |
          if git diff --quiet -- konfigurator/soltec-premium.js; then
            echo 'Already committed.'
            exit 0
          fi
          test "$(git diff --name-only)" = "konfigurator/soltec-premium.js"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add konfigurator/soltec-premium.js
          git commit -m 'fix: seal only internal Koverta BSP fragment edges'
          git push origin HEAD:fix/koverta-final-repair-20260910
