name: Final site audit retry 20260911

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: [.github/workflows/tmp-final-site-audit-retry-20260911.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply remaining verified carport gallery correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('carport-soltec/index.html')
          s=p.read_text(encoding='utf-8')
          old='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-canopy-f170-real.jpg" width="2000" height="1239" alt="SL 170 pre jedno auto" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">SL 170 pre jedno auto</p></div></article>'''
          new='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-carport-plavecky-03.jpg" alt="Hliníkový carport Soltec s otvoreným státím pri rodinnom dome" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">Carport Soltec s otvoreným státím</p></div></article>'''
          if old in s:
              if s.count(old)!=1: raise SystemExit(f'gallery anchor count {s.count(old)}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('neither old nor corrected gallery card found')
          PY
          git diff --check
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "carport-soltec/index.html" ]; then echo "unexpected scope: $CHANGED"; exit 1; fi

      - name: Static content and asset audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import posixpath
          roots=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          broken=[]
          class P(HTMLParser):
              def __init__(self,file): super().__init__(); self.file=file
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ('src','href'):
                      raw=d.get(key)
                      if not raw or raw.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')): continue
                      if tag=='a' and key=='href': continue
                      val=unquote(urlsplit(raw).path)
                      if not val: continue
                      target=Path('.'+val) if val.startswith('/') else self.file.parent/val
                      target=Path(posixpath.normpath(str(target)))
                      if (target.suffix or tag in ('img','script','link','source','video')) and not target.exists(): broken.append((str(self.file),tag,key,raw,str(target)))
          for f in roots:
              try: P(f).feed(f.read_text(encoding='utf-8'))
              except UnicodeDecodeError: pass
          if broken:
              for row in broken[:100]: print(row)
              raise SystemExit('broken local assets')
          car=Path('carport-soltec/index.html').read_text(encoding='utf-8')
          a=car.index('class="kh-cat__grid"'); b=car.index('</section>',a); gallery=car[a:b]
          if 'soltec-canopy-f170-real.jpg' in gallery or 'SL 170 pre jedno auto' in gallery: raise SystemExit('misleading carport gallery content remains')
          a=car.index('id="modely-carport"'); b=car.index('</section>',a); models=car[a:b]
          if 'soltec-carport-f240-real.jpg' in models: raise SystemExit('F240 image still used as SL model card')
          for token in ('SL 170','SL 240','3,14 m','8,0 m','6,0 m','8,5 m','ISO panel 30 mm'):
              if token not in models: raise SystemExit('carport model fact missing '+token)
          can=Path('pevne-prestresenia/index.html').read_text(encoding='utf-8')
          a=can.index('id="typy-prestresenia"'); b=can.index('</section>',a); sec=can[a:b]
          for token in ('F170','F240','G170','G240'):
              if token not in sec: raise SystemExit('canopy model missing '+token)
          home=Path('index.html').read_text(encoding='utf-8')
          if home.count('data-k-step>') != 5: raise SystemExit('home process step count drift')
          perg=Path('bioklimaticke-pergoly/index.html').read_text(encoding='utf-8')
          if perg.count('class="kh-odtien"') != 8: raise SystemExit('Soltec color count drift')
          print('static audit passed',len(roots),'HTML files')
          PY
          node --check assets/koverta-2026.js
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/koverta-cfg-enhance.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-retry-pw qa-final-retry
          cd /tmp/final-retry-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          npx playwright install chromium

      - name: Browser audit desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8913 >/tmp/final-retry-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8913/ >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-retry-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node - <<'JS'
          const {chromium}=require('playwright'); const path=require('path'),proc=require('node:process');
          const routes=[['home','/'],['cars','/pristresky-pre-auta/'],['garden','/zahradne-pristresky/'],['carport','/carport-soltec/'],['bio','/bioklimaticke-pergoly/'],['canopy','/pevne-prestresenia/'],['shade','/tienenie/'],['kitchen','/outdoor-kuchyne/'],['realizations','/realizacie/'],['cfg-koverta','/konfigurator/?page=koverta'],['cfg-carport','/konfigurator/?page=carport'],['cfg-canopy','/konfigurator/?page=canopy'],['cfg-bio','/konfigurator/?page=bio']];
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:proc.env.CHROME,args:['--no-sandbox','--disable-gpu']});
          for(const vp of [{w:1440,h:1000,n:'desktop'},{w:390,h:844,n:'mobile'}]) for(const [name,url] of routes){
            const ctx=await browser.newContext({viewport:{width:vp.w,height:vp.h}}),page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.route('**/*',route=>{const u=new URL(route.request().url()); if(u.hostname==='127.0.0.1'||u.hostname==='localhost') return route.continue(); return route.abort();});
            const resp=await page.goto('http://127.0.0.1:8913'+url,{waitUntil:'domcontentloaded',timeout:30000}); if(!resp||!resp.ok()) throw new Error(`${name} ${vp.n} HTTP ${resp&&resp.status()}`); await page.waitForTimeout(500);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(overflow>2) throw new Error(`${name} ${vp.n} overflow ${overflow}`);
            const imgs=await page.locator('img[src]').evaluateAll(els=>[...new Set(els.map(el=>el.getAttribute('src')).filter(src=>src&&!/^https?:|^data:/.test(src)))]); for(const src of imgs){const r=await ctx.request.get(new URL(src,page.url()).href,{timeout:15000}); if(!r.ok()) throw new Error(`${name} broken image ${src}: ${r.status()}`)}
            if(errors.length) throw new Error(`${name} ${vp.n} pageerror ${errors.join(' | ')}`);
            if(name==='home' && await page.locator('[data-k-process] [data-k-step]').count()!==5) throw new Error('home process drift');
            if(name==='carport'){const t=(await page.locator('#modely-carport').innerText()).replace(/\s+/g,' '); for(const x of ['SL 170','SL 240','ISO panel 30 mm']) if(!t.includes(x)) throw new Error('carport missing '+x);}
            if(name==='canopy'){const t=await page.locator('#typy-prestresenia').innerText(); for(const x of ['F170','F240','G170','G240']) if(!t.includes(x)) throw new Error('canopy missing '+x);}
            if(name==='bio' && await page.locator('section.kh-farby .kh-odtien').count()!==8) throw new Error('color count drift');
            if(['home','carport','canopy','bio'].includes(name)){const loc=name==='home'?page.locator('body'):name==='carport'?page.locator('#modely-carport'):name==='canopy'?page.locator('#typy-prestresenia'):page.locator('section.kh-farby'); await loc.screenshot({path:path.join(proc.env.GITHUB_WORKSPACE,'qa-final-retry',`${name}-${vp.n}.png`)})}
            await ctx.close();
          } await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Run core configurator regressions
        shell: bash
        env:
          KV_URL: http://127.0.0.1:8914/konfigurator/?page=koverta
        run: |
          set -euo pipefail
          python3 -m http.server 8914 >/tmp/final-retry-cfg-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS 'http://127.0.0.1:8914/konfigurator/?page=koverta' >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-retry-pw/node_modules
          for t in pricing-logic osnova-podla-expivi technical-fidelity layout-smoke routing-smoke browser-qa; do
            echo "=== $t ==="
            node "konfigurator/test/$t.js"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-site-audit-retry-${{ github.sha }}
          path: qa-final-retry/*.png
          if-no-files-found: error

      - name: Commit validated correction and cleanup temporary audits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- carport-soltec/index.html; then
            git add carport-soltec/index.html
            git commit -m 'fix: remove misleading SL170 gallery claim'
          fi
          git rm .github/workflows/tmp-final-site-audit-20260911.yml .github/workflows/tmp-final-site-audit-retry-20260911.yml
          git commit -m 'ci: remove temporary final site audits'
          git push origin HEAD:fix/koverta-final-repair-20260910
