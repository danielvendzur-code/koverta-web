name: Scenery and precipitation review
on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: ['konfigurator/**', '.github/workflows/scene-review.yml']
permissions:
  contents: read
jobs:
  scene-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/scene-life.js
          node konfigurator/test/scene-assets.js
          node konfigurator/test/scene-surface.js
          node konfigurator/test/technical-fidelity.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8901 >/tmp/scene-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/ >/dev/null; then break; fi
            sleep 1
          done
          node konfigurator/test/scene-review.js
          node konfigurator/test/pocasie-odtok.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-review
          path: qa-artifacts/scene-review
