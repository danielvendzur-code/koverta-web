name: Koverta configurator QA

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  configurator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/?page=koverta >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Koverta geometry regression
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: |
          node configurator/test/stlpy-vidno.js
          node configurator/test/prekrytie.js
          node configurator/test/strecha-nepresvita.js
          node configurator/test/plynulost.js
