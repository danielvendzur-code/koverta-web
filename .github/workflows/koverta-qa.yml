name: Koverta configurator QA

on:
  push:
    branches: [master, fix/final-koverta-audit-20260909, agent/05-koverta-technical-fidelity, agent/06-koverta-final-integration]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: koverta-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Hlboké kontroly vykresľovania trvajú takmer hodinu a kontrolujú jedinú
  # vec: čo nakreslí konfigurátor. Pri zmene textu na stránke alebo štýlu
  # nemajú čo overovať a len držia prácu v rade. Táto úloha zistí, či sa
  # konfigurátora niečo dotklo, a ostatné sa podľa nej rozhodnú.
  zmeny:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      konfigurator: ${{ steps.zisti.outputs.konfigurator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: zisti
        env:
          ZAKLAD: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Pri behu nad vetvou (push) nie je s čím porovnávať, takže sa
          # kontroluje všetko. Istota je dôležitejšia než ušetrený čas.
          if [ -z "${ZAKLAD:-}" ]; then
            echo "konfigurator=true" >> "$GITHUB_OUTPUT"
            echo "push bez základu — hlboké kontroly bežia"
            exit 0
          fi
          git fetch --no-tags --depth=200 origin "$ZAKLAD" || git fetch --no-tags origin
          SUBORY=$(git diff --name-only "$ZAKLAD"...HEAD || git diff --name-only HEAD~1 HEAD)
          echo "$SUBORY"
          KONFIG_RIADKY=$(git diff -U0 "$ZAKLAD"...HEAD -- konfigurator coordination/koverta 2>/dev/null \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | grep -vE 'koverta-2026\.(css|js)\?v=' || true)
          if echo "$SUBORY" | grep -qE '^coordination/koverta/' || { echo "$SUBORY" | grep -qE '^konfigurator/' && test -n "$KONFIG_RIADKY"; }; then
            echo "konfigurator=true" >> "$GITHUB_OUTPUT"
            echo "konfigurátor sa zmenil — hlboké kontroly bežia"
          else
            echo "konfigurator=false" >> "$GITHUB_OUTPUT"
            echo "len web a verzia štýlu — hlboké 3D kontroly sa preskočia"
          fi

  site-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate realization map content
        run: node konfigurator/test/realizacie-map.js
      - name: Validate generated pages, SEO and renderer invariants
        run: |
          node konfigurator/test/koverta-render-regression.js
          node tools/seo-audit.js
          python3 tools/adresy.py --check
          python3 tools/cta-kontrola.py
          node tools/produkty-zive.js --check
          node tools/zmensi-css.js --kontrola
          node tools/verzie-suborov.js
          node tools/rozmery-obrazkov.js
          python3 tools/generuj-rozmery.py
          python3 tools/adresy.py
          git diff --exit-code -- sitemap.xml llms.txt pristresky-pre-auta zahradne-pristresky
      - name: Validate Shopify theme
        run: |
          node tools/spolocne-casti.js --kontrola
          node tools/shopify-produkt-kontrola.js
          node --check tools/shopify-products.js
          node tools/shopify-products.js --check
          node tools/shopify-products.js --scope=reference
          node --check tools/shopify-redirects.js
          node tools/shopify-redirects.js --check
          node tools/shopify-tema.js
          node tools/shopify-kontrola.js

  configurator:
    needs: zmeny
    if: needs.zmeny.outputs.konfigurator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [pricing-logic, osnova-podla-expivi, technical-fidelity, koverta-accessories, layout-smoke, stlpy-vidno, stlpy-rozostup, krytina-strechy, prekrytie, strecha-nepresvita, routing-smoke, browser-qa, pocasie-odtok, realizacie-gallery]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify QA files
        run: |
          test -f "konfigurator/test/${{ matrix.test }}.js"
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/koverta-cfg-enhance.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=koverta' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Koverta regression
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: node "konfigurator/test/${{ matrix.test }}.js"
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koverta-visual-qa-${{ matrix.test }}
          path: qa-artifacts
          if-no-files-found: ignore

  # Plynulosť siluety prejde 1 095 pohľadov a pri každom serializuje SVG,
  # dekóduje ho a prekreslí na plátno. V bežnej matici s 30-minútovým limitom
  # skončila zakaždým ako `cancelled` — výsledok, ktorý nikto nedostal. Delí sa
  # po rozmeroch; každý shard prejde svoje rozmery celé a doručí vlastný verdikt.
  plynulost:
    needs: zmeny
    if: needs.zmeny.outputs.konfigurator == 'true'
    name: plynulost (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=koverta' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Silhouette continuity
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
          KV_SHARD_INDEX: ${{ matrix.shard }}
          KV_SHARD_TOTAL: 3
        run: node konfigurator/test/plynulost.js

  occlusion-deep:
    needs: zmeny
    if: needs.zmeny.outputs.konfigurator == 'true'
    name: occlusion-deep (${{ matrix.script }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-24.04
    # Dlhé testy sú rozdelené podľa rozmerov. Každý shard musí skončiť s
    # vlastným výsledkom; timeout sa už nesmie vydávať za zelenú kontrolu.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        # Namerané na behu 35469231125: štyri časti component-visibility
        # dobehli za 25 až 37 minút, ale occlusion-sweep aj focused-render-qa
        # skončili presne na 55. minúte ako `cancelled`. Sweep prejde 54
        # kombinácií rozmerov, takže na tretiny to bolo 18 na časť — priveľa.
        # Deväť častí dá šesť kombinácií na časť, čiže okolo osemnástich minút.
        # Focused-render-qa delenie nemalo vôbec; má tri rozmery, tak tri časti.
        include:
          - { script: 02-occlusion-sweep, shard: 0, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 1, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 2, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 3, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 4, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 5, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 6, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 7, shards: 9 }
          - { script: 02-occlusion-sweep, shard: 8, shards: 9 }
          - { script: 02-component-visibility, shard: 0, shards: 4 }
          - { script: 02-component-visibility, shard: 1, shards: 4 }
          - { script: 02-component-visibility, shard: 2, shards: 4 }
          - { script: 02-component-visibility, shard: 3, shards: 4 }
          - { script: 02-focused-render-qa, shard: 0, shards: 3 }
          - { script: 02-focused-render-qa, shard: 1, shards: 3 }
          - { script: 02-focused-render-qa, shard: 2, shards: 3 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify deep QA script
        run: test -f "coordination/koverta/${{ matrix.script }}.js"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/konfigurator/?page=koverta' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Deep render QA
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
          KV_SHARD_INDEX: ${{ matrix.shard }}
          KV_SHARD_TOTAL: ${{ matrix.shards }}
        run: node "coordination/koverta/${{ matrix.script }}.js"
      - name: Upload deep QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koverta-deep-qa-${{ matrix.script }}-${{ matrix.shard }}
          path: qa-artifacts
          if-no-files-found: ignore

  soltec-motion:
    needs: zmeny
    if: needs.zmeny.outputs.konfigurator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify renderer and motion test syntax
        run: |
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/test/soltec-motion-regression.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/soltec-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8901/bioklimaticke-pergoly/' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soltec-http.log
          exit 1
      - name: Soltec louver and camera motion regression
        env:
          SOLTEC_URL: http://127.0.0.1:8901/konfigurator/?page=bio
        run: node konfigurator/test/soltec-motion-regression.js
      - name: Upload Soltec motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soltec-motion-qa
          path: qa-artifacts/soltec-motion
          if-no-files-found: ignore
