name: Koverta configurator QA

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  configurator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify QA files
        run: ls -la konfigurator/test && test -f konfigurator/test/layout-smoke.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8901 >/tmp/koverta-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8901/konfigurator/?page=koverta >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/koverta-http.log
          exit 1
      - name: Koverta geometry regression
        env:
          KV_URL: http://127.0.0.1:8901/konfigurator/?page=koverta
        run: |
          node konfigurator/test/layout-smoke.js
          node konfigurator/test/stlpy-vidno.js
          node konfigurator/test/prekrytie.js
          node konfigurator/test/strecha-nepresvita.js
          node konfigurator/test/plynulost.js
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koverta-visual-qa
          path: qa-artifacts
          if-no-files-found: ignore
