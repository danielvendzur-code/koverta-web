# Jednorazové skúšobné dopyty na ostrom webe (na žiadosť majiteľa).
# Spustí sa len zmenou súboru .github/testovacie-dopyty/spustit.txt na tejto
# vetve; po overení sa workflow aj skript zmažú.
name: Testovacie dopyty
on:
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: ['.github/testovacie-dopyty/spustit.txt']
permissions:
  contents: read
jobs:
  poslat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/testovacie-dopyty
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: node .github/testovacie-dopyty/poslat.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vysledky
          path: vysledky
