name: Batch 4 catalog dimensions QA

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch4-dimensions-20260911.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply guarded catalog redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-batch4-apply.py
          git diff --check

      - name: Browser QA and visual evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8904 >/tmp/koverta-b4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          mkdir -p /tmp/koverta-b4-pw qa-batch4
          cd /tmp/koverta-b4-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          export NODE_PATH=/tmp/koverta-b4-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node scripts/tmp-batch4-check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch4-dimensions-${{ github.sha }}
          path: qa-batch4/*.png
          if-no-files-found: error

      - name: Commit only approved product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pristresky-pre-auta/index.html zahradne-pristresky/index.html assets/koverta-2026.css
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' assets/koverta-2026.css pristresky-pre-auta/index.html zahradne-pristresky/index.html)"
          test "$staged" = "$expected"
          git commit -m 'fix: simplify catalog size selection'
          git rm .github/workflows/tmp-batch4-dimensions-20260911.yml scripts/tmp-batch4-apply.py scripts/tmp-batch4-check.js
          git commit -m 'ci: remove temporary batch 4 QA files'
          git push origin HEAD:fix/koverta-final-repair-20260910
