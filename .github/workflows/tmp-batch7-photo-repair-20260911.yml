name: Batch 7 Soltec imagery repair

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch7-photo-repair-20260911.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply scoped carport image and slope correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('carport-soltec/index.html')
          s=p.read_text(encoding='utf-8')

          old='<figure class="k-model-card__media"><img src="../assets/soltec-carport-f240-real.jpg" width="2400" height="1500" alt="Profesionálna fotografia hliníkového carportu Soltec" loading="lazy" decoding="async"></figure>'
          new='<figure class="k-model-card__media"><img src="../assets/soltec-carport-vstup-garaz.jpg" alt="Jednomiestny hliníkový carport Soltec pri garáži rodinného domu" title="Carport Soltec pre jedno auto" loading="lazy" decoding="async"></figure>'
          if s.count(old)!=1: raise SystemExit(f'SL170 image anchor drift: {s.count(old)}')
          s=s.replace(old,new,1)

          old='Strechu radu SL tvorí 3 cm ISO panel so spádom smerom k odvodneniu. Presnú skladbu a zaťaženie volíme podľa konkrétnej zostavy.'
          new='Strechu radu SL tvorí 3 cm ISO panel so spádom smerom k odvodneniu. Podľa konkrétnej zostavy môže byť spád skrytý alebo priznaný; presnú skladbu potvrdíme pri návrhu.'
          if s.count(old)!=1: raise SystemExit(f'slope paragraph anchor drift: {s.count(old)}')
          s=s.replace(old,new,1)
          old='<p class="kh-mat__pojem">Spád</p><p class="kh-mat__hodnota">skrytý v ráme</p>'
          new='<p class="kh-mat__pojem">Spád</p><p class="kh-mat__hodnota">skrytý / priznaný</p>'
          if s.count(old)!=1: raise SystemExit(f'slope value anchor drift: {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "carport-soltec/index.html"

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b7repair-pw qa-b7repair
          cd /tmp/b7repair-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1

      - name: Browser QA and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8911 >/tmp/b7repair-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          export NODE_PATH=/tmp/b7repair-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node - <<'JS'
          const {chromium}=require('playwright');const path=require('path'),p=require('node:process');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:p.env.CHROME,args:['--no-sandbox','--disable-gpu']});
          for(const vp of [{w:1440,h:1000,n:'desktop'},{w:390,h:844,n:'mobile'}]){
            const c=await b.newContext({viewport:{width:vp.w,height:vp.h}}),page=await c.newPage();const errs=[];page.on('pageerror',e=>errs.push(String(e)));
            await page.goto('http://127.0.0.1:8911/carport-soltec/#modely-carport',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(800);
            const consent=page.getByRole('button',{name:/Iba nevyhnutné|Odmietnuť|Nevyhnutné/i}).first();if(await consent.count()){try{await consent.click({timeout:500})}catch{}}
            const sec=page.locator('#modely-carport');await sec.scrollIntoViewIfNeeded();await page.waitForTimeout(250);
            const first=sec.locator('.k-model-card').first();const img=first.locator('img');await img.scrollIntoViewIfNeeded();await page.waitForTimeout(150);
            const st=await img.evaluate(el=>({c:el.complete,w:el.naturalWidth,h:el.naturalHeight,src:el.getAttribute('src'),alt:el.alt}));
            if(!st.c||st.w<100||st.h<100)throw new Error('SL170 image broken '+JSON.stringify(st));
            if(!st.src.endsWith('soltec-carport-vstup-garaz.jpg'))throw new Error('wrong SL170 image '+st.src);
            if(!/Jednomiestny/.test(st.alt))throw new Error('SL170 alt not specific');
            const text=(await page.locator('body').textContent()).replace(/\s+/g,' ');
            if(!text.includes('skrytý / priznaný'))throw new Error('slope value not harmonized');
            if(!text.includes('môže byť spád skrytý alebo priznaný'))throw new Error('slope explanatory copy missing');
            for(const code of ['SL 170','SL 240'])if(!(await sec.textContent()).includes(code))throw new Error('model code missing '+code);
            const ov=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(ov>2)throw new Error('overflow '+ov);
            if(errs.length)throw new Error(errs.join(' | '));
            await sec.screenshot({path:path.join(p.env.GITHUB_WORKSPACE,'qa-b7repair','carport-'+vp.n+'.png')});await c.close();
          }await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: batch7-carport-repair-${{ github.sha }}
          path: qa-b7repair/*.png
          if-no-files-found: error

      - name: Commit repair and cleanup discovery files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carport-soltec/index.html
          git commit -m 'fix: align SL170 imagery and slope copy'
          git rm .github/workflows/tmp-batch7-photo-repair-20260911.yml .github/workflows/tmp-batch7-photo-pick-20260911.yml
          git commit -m 'ci: remove temporary Batch 7 photo QA files'
          git push origin HEAD:fix/koverta-final-repair-20260910
