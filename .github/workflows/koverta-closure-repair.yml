name: Koverta guarded fascia closure repair

on:
  push:
    branches: [fix/koverta-final-repair-20260910]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact Koverta fascia repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('konfigurator/soltec-premium.js')
          text = path.read_text(encoding='utf-8')

          old_turn = "              put(zav - 9 * dir, zav + 10 * dir, zTop - LEM_ARM - 14, 14 + LEM_ARM);"
          new_turn = "              const turnBottom = trapBot - 1;\n              put(zav - 9 * dir, zav + 10 * dir, turnBottom, zTop - turnBottom);"
          closure_start = "              /* A narrow hidden closure caps the sight line beneath the\n"
          closure_body = "              const uz = trapBot - 0.5;"
          closure_end = "              });\n            };"
          marker = 'const turnBottom = trapBot - 1;'

          if marker in text:
              if closure_start in text or closure_body in text:
                  raise SystemExit('partial fascia repair detected')
              print('Guarded fascia repair already present.')
          else:
              if text.count(old_turn) != 1:
                  raise SystemExit(f'expected one hidden-turn target, got {text.count(old_turn)}')
              if text.count(closure_start) != 1 or text.count(closure_body) != 1:
                  raise SystemExit('horizontal closure markers are not unique')
              start = text.index(closure_start)
              end_anchor = text.index(closure_end, start)
              end = end_anchor + len("              });\n")
              closure = text[start:end]
              if 'const ua = ' not in closure or 'const ub = ' not in closure or 'quad(closure, roofEdgeHex' not in closure:
                  raise SystemExit('closure structure does not match expected renderer block')
              text = text.replace(old_turn, new_turn, 1)
              text = text[:start] + text[end:]
              if closure_start in text or closure_body in text or 'quad(closure, roofEdgeHex' in text:
                  raise SystemExit('horizontal closure residue remains')
              path.write_text(text, encoding='utf-8')
              print('Replaced horizontal roof closure with extended vertical fascia turn.')
          PY

          node --check konfigurator/soltec-premium.js
          git diff --check
          git diff --exit-code -- archiv-expivi konfigurator/test coordination/koverta assets/mapa/reca.jpg

      - name: Commit only verified renderer repair
        run: |
          if git diff --quiet -- konfigurator/soltec-premium.js; then
            echo 'Renderer repair already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- konfigurator/soltec-premium.js
          test "$(git diff --cached --name-only)" = "konfigurator/soltec-premium.js"
          git commit -m 'fix: close Koverta roof sightline in fascia'
          git push origin HEAD:fix/koverta-final-repair-20260910
