name: Koverta guarded geometry repair

on:
  push:
    branches: [fix/koverta-final-repair-20260910]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded Koverta geometry repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('konfigurator/soltec-premium.js')
          text = path.read_text(encoding='utf-8')

          old_turn = "              put(zav - 9 * dir, zav + 10 * dir, zTop - LEM_ARM - 14, 14 + LEM_ARM);"
          new_turn = "              const turnBottom = trapBot - 1;\n              put(zav - 9 * dir, zav + 10 * dir, turnBottom, zTop - turnBottom);"
          closure_start = "              /* A narrow hidden closure caps the sight line beneath the\n"
          closure_body = "              const uz = trapBot - 0.5;"
          closure_end = "              });\n            };"

          old_cull = "                if (!bokom && Math.abs(n[2]) < 0.4) continue;"
          new_cull = "                if (!bokom && Math.abs(n[2]) < 0.4) continue;\n                /* The upper C-profile flange is permanently covered by the sheet.\n                   Do not emit its +Z face: at the corrugation valleys it is exactly\n                   coplanar with trapLowerZ and only adds a BSP splitting plane. */\n                if (podStrechou && n[2] > 0.9) continue;"

          slat_anchor = "                const d = Math.min(KV_SLAT.hrubka, Math.max(12, gw * 0.62));"
          slat_anchor_new = slat_anchor + "\n                /* KV_SLAT.zapust seats each Koverta slat inside both vertical guides.\n                   Only the concealed ends grow; visible pitch/height stay unchanged. */\n                const embed = Math.min(KV_SLAT.zapust, Math.max(0, gw - 2)) / Math.max(1, uLen);\n                const slatT0 = Math.max(0, t0 - embed);\n                const slatT1 = Math.min(1, t1 + embed);"
          slat_memb = "                  memb(t0, t1, a, a + KV_SLAT.vyska, depth - d / 2, depth + d / 2, tone, [], SHAFT);"
          slat_memb_new = "                  memb(slatT0, slatT1, a, a + KV_SLAT.vyska, depth - d / 2, depth + d / 2, tone, [], SHAFT);"

          closure_done = 'const turnBottom = trapBot - 1;' in text
          c_done = 'if (podStrechou && n[2] > 0.9) continue;' in text
          slat_done = 'const slatT0 = Math.max(0, t0 - embed);' in text

          if not closure_done:
              if text.count(old_turn) != 1:
                  raise SystemExit(f'expected one hidden-turn target, got {text.count(old_turn)}')
              if text.count(closure_start) != 1 or text.count(closure_body) != 1:
                  raise SystemExit('horizontal closure markers are not unique')
              start = text.index(closure_start)
              end_anchor = text.index(closure_end, start)
              end = end_anchor + len("              });\n")
              closure = text[start:end]
              if 'const ua = ' not in closure or 'const ub = ' not in closure or 'quad(closure, roofEdgeHex' not in closure:
                  raise SystemExit('closure structure does not match expected renderer block')
              text = text[:start] + text[end:]
              text = text.replace(old_turn, new_turn, 1)
          elif closure_start in text or closure_body in text or 'quad(closure, roofEdgeHex' in text:
              raise SystemExit('partial fascia repair detected')

          if not c_done:
              if text.count(old_cull) != 1:
                  raise SystemExit(f'expected one C-profile cull target, got {text.count(old_cull)}')
              text = text.replace(old_cull, new_cull, 1)

          if not slat_done:
              if text.count(slat_anchor) != 1:
                  raise SystemExit(f'expected one Koverta slat anchor, got {text.count(slat_anchor)}')
              if text.count(slat_memb) != 1:
                  raise SystemExit(f'expected one Koverta slat member target, got {text.count(slat_memb)}')
              text = text.replace(slat_anchor, slat_anchor_new, 1)
              text = text.replace(slat_memb, slat_memb_new, 1)

          forbidden = ['const uz = trapBot - 0.5;', 'quad(closure, roofEdgeHex']
          if any(token in text for token in forbidden):
              raise SystemExit('horizontal closure residue remains')

          path.write_text(text, encoding='utf-8')
          print('Applied guarded Koverta geometry repair.')
          PY

          node --check konfigurator/soltec-premium.js
          git diff --check
          git diff --exit-code -- archiv-expivi konfigurator/test coordination/koverta assets/mapa/reca.jpg

      - name: Commit only verified renderer repair
        run: |
          if git diff --quiet -- konfigurator/soltec-premium.js; then
            echo 'Renderer repair already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- konfigurator/soltec-premium.js
          test "$(git diff --cached --name-only)" = "konfigurator/soltec-premium.js"
          git commit -m 'fix: repair Koverta roof edge and hidden contacts'
          git push origin HEAD:fix/koverta-final-repair-20260910
