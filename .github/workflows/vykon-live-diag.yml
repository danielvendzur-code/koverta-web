name: Diagnostika výkonu živého Shopify webu
on:
  push:
    branches: [qa/vykon-live-20261002]
permissions:
  contents: read
jobs:
  meranie:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Porovnať štart a prvý obraz bez zmeny produkcie
        env:
          CHROME_PATH: /usr/bin/google-chrome
          KOVER_QA_OUT: vysledky
        run: |
          mkdir vysledky
          npm install --no-save playwright@1.58.2
          node tools/experiment-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-live
          path: vysledky/
