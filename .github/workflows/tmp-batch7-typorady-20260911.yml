name: Batch 7 Soltec model QA

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-batch7-typorady-20260911.yml

permissions:
  contents: write

jobs:
  batch7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply scoped model refinement
        run: |
          set -euo pipefail
          python3 scripts/tmp-batch7-apply.py
          git diff --check

      - name: Install browser QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/koverta-b7-pw qa-batch7
          cd /tmp/koverta-b7-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1

      - name: Browser QA and screenshots
        run: |
          set -euo pipefail
          python3 -m http.server 8909 >/tmp/koverta-b7-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          export NODE_PATH=/tmp/koverta-b7-pw/node_modules
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node scripts/tmp-batch7-check.js

      - uses: actions/upload-artifact@v4
        with:
          name: batch7-typorady-${{ github.sha }}
          path: qa-batch7/*.png
          if-no-files-found: error

      - name: Commit validated change and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carport-soltec/index.html pevne-prestresenia/index.html assets/koverta-2026.css
          git diff --name-only -- '*.html' | xargs -r git add
          git commit -m 'feat: clarify Soltec model choices'
          git rm .github/workflows/tmp-batch7-typorady-20260911.yml .github/workflows/tmp-batch7-locate-20260911.yml scripts/tmp-batch7-apply.py scripts/tmp-batch7-check.js
          git commit -m 'ci: remove temporary batch 7 QA files'
          git push origin HEAD:fix/koverta-final-repair-20260910
