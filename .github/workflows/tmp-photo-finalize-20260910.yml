name: Finalize verified photo curation

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-photo-finalize-20260910.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/koverta-final-repair-20260910
          fetch-depth: 0

      - name: Fetch verified supporting Soltec realization photos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1od4WMemC8xg7uRd94bvMCUzHNdQruicZ=w1600' \
            -o assets/soltec-bioklimaticka-pergola-limbach-detail.jpg
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1Aypah14Ps1WFaO2lRLL6k12TYkvSf-B7=w1600' \
            -o assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1s-5KnW9jz5mxeZzcL2tjJuu5TRsA_XTn=w1600' \
            -o assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg

          # Make new files visible to `git diff --name-only` without staging their content.
          git add -N -- \
            assets/soltec-bioklimaticka-pergola-limbach-detail.jpg \
            assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg \
            assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg

      - name: Run the already-reviewed scoped transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-photo-curation-v2-20260910.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1:
              raise SystemExit('Expected exactly one embedded Python transformation block')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected indentation in transformation block')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/photo-curation.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/photo-curation.py
          git diff --check

      - name: Commit only verified photo scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            pristresky-pre-auta/index.html \
            zahradne-pristresky/index.html \
            carport-soltec/index.html \
            pevne-prestresenia/index.html \
            bioklimaticke-pergoly/index.html \
            tienenie/index.html \
            outdoor-kuchyne/index.html \
            assets/soltec-bioklimaticka-pergola-limbach-detail.jpg \
            assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg \
            assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg

          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --check
          git commit -m 'fix: curate Koverta and Soltec photography'
          git push origin HEAD:fix/koverta-final-repair-20260910