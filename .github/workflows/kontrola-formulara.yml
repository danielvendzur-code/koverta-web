# Jednorazová kontrola servera formulára (na žiadosť majiteľa); po nej sa zmaže.
name: Kontrola formulára
on:
  push:
    branches: [claude/practical-dijkstra-d9d0nt]
    paths: ['.github/kontrola-formulara/spustit.txt']
permissions:
  contents: read
jobs:
  kontrola:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/kontrola-formulara
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/kontrola-formulara/kontrola.js
