name: Verified photo curation v2

on:
  push:
    branches:
      - fix/koverta-final-repair-20260910
    paths:
      - .github/workflows/tmp-photo-curation-v2-20260910.yml

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/koverta-final-repair-20260910
          fetch-depth: 0

      - name: Fetch three verified supporting Soltec realization photos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1od4WMemC8xg7uRd94bvMCUzHNdQruicZ=w1600' \
            -o assets/soltec-bioklimaticka-pergola-limbach-detail.jpg
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1Aypah14Ps1WFaO2lRLL6k12TYkvSf-B7=w1600' \
            -o assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg
          curl -fsSL --retry 3 --retry-delay 2 \
            'https://lh3.googleusercontent.com/d/1s-5KnW9jz5mxeZzcL2tjJuu5TRsA_XTn=w1600' \
            -o assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg

      - name: Apply strictly scoped photo replacements and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import struct
          import subprocess

          html_files = {
              "pristresky-pre-auta/index.html",
              "zahradne-pristresky/index.html",
              "carport-soltec/index.html",
              "pevne-prestresenia/index.html",
              "bioklimaticke-pergoly/index.html",
              "tienenie/index.html",
              "outdoor-kuchyne/index.html",
          }
          added_assets = {
              "assets/soltec-bioklimaticka-pergola-limbach-detail.jpg",
              "assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg",
              "assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg",
          }
          allowed_changes = html_files | added_assets

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old[:160]!r}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8")

          def image_size(path: str) -> tuple[int, int]:
              data = Path(path).read_bytes()
              if data.startswith(b"\x89PNG\r\n\x1a\n") and len(data) >= 24:
                  return struct.unpack(">II", data[16:24])
              if data[:2] == b"\xff\xd8":
                  i = 2
                  sof = {
                      0xC0, 0xC1, 0xC2, 0xC3,
                      0xC5, 0xC6, 0xC7,
                      0xC9, 0xCA, 0xCB,
                      0xCD, 0xCE, 0xCF,
                  }
                  while i + 9 < len(data):
                      if data[i] != 0xFF:
                          i += 1
                          continue
                      while i < len(data) and data[i] == 0xFF:
                          i += 1
                      if i >= len(data):
                          break
                      marker = data[i]
                      i += 1
                      if marker in {0xD8, 0xD9} or 0xD0 <= marker <= 0xD7:
                          continue
                      if i + 2 > len(data):
                          break
                      length = int.from_bytes(data[i:i + 2], "big")
                      if length < 2 or i + length > len(data):
                          break
                      if marker in sof and length >= 7:
                          height = int.from_bytes(data[i + 3:i + 5], "big")
                          width = int.from_bytes(data[i + 5:i + 7], "big")
                          if width <= 0 or height <= 0:
                              break
                          return width, height
                      i += length
              raise SystemExit(f"Cannot read image dimensions / invalid image: {path}")

          def dims(asset: str) -> tuple[int, int]:
              path = f"assets/{asset}"
              if not Path(path).is_file():
                  raise SystemExit(f"Missing required asset: {path}")
              return image_size(path)

          for asset_path in sorted(added_assets):
              width, height = image_size(asset_path)
              if width < 1200 or height < 700:
                  raise SystemExit(
                      f"Downloaded realization image is unexpectedly small: {asset_path} = {width}x{height}"
                  )

          p = "pristresky-pre-auta/index.html"
          replace_exact(
              p,
              '<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1nxq4twPeH1LSifkgS31HQGO4M3e4k2fs=w2000" fetchpriority="high">',
              '<link rel="preload" as="image" href="../assets/koverta-pristresok-auto-trnava-sikmy.jpg" fetchpriority="high">',
          )
          replace_exact(
              p,
              '<meta property="og:image" content="../assets/koverta-carport-lamely-stena.jpg">',
              '<meta property="og:image" content="https://danielvendzur-code.github.io/koverta-web/assets/koverta-pristresok-auto-trnava-sikmy.jpg">',
          )
          replace_exact(
              p,
              '<meta name="twitter:image" content="https://koverta.sk/cdn/shop/files/03.jpg?width=1200">',
              '<meta name="twitter:image" content="https://danielvendzur-code.github.io/koverta-web/assets/koverta-pristresok-auto-trnava-sikmy.jpg">',
          )
          w, h = dims("koverta-pristresok-auto-trnava-hero.jpg")
          replace_exact(
              p,
              '<img src="../assets/koverta-pristresok-garaz.jpg" width="1800" height="1350" alt="Dvojmiestny prístrešok pri rodinnom dome" loading="lazy" decoding="async">',
              f'<img src="../assets/koverta-pristresok-auto-trnava-hero.jpg" width="{w}" height="{h}" alt="Dvojmiestny prístrešok Koverta v Trnave — pohľad z iného uhla" title="Prístrešok Koverta pre dve autá — Trnava" loading="lazy" decoding="async">',
          )

          p = "zahradne-pristresky/index.html"
          replace_exact(
              p,
              '<link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1-f0lkIcKvJ2xBggzkDtgVhivR-Rl5haD=w2000" fetchpriority="high">',
              '<link rel="preload" as="image" href="../assets/koverta-zahradny-pristresok-bratislava-detail.jpg" fetchpriority="high">',
          )
          w, h = dims("koverta-zahradny-pristresok-bratislava-hero.jpg")
          replace_exact(
              p,
              '<img src="../assets/koverta-zahradny-pristresok-bratislava-detail.jpg" width="1600" height="1200" alt="Detail nosnej konštrukcie záhradného prístrešku Koverta v Bratislave" decoding="async" loading="lazy">',
              f'<img src="../assets/koverta-zahradny-pristresok-bratislava-hero.jpg" width="{w}" height="{h}" alt="Záhradný prístrešok Koverta v Bratislave — pohľad z iného uhla" title="Záhradný prístrešok Koverta — Bratislava" decoding="async" loading="lazy">',
          )

          p = "carport-soltec/index.html"
          replace_exact(
              p,
              '<link rel="preload" as="image" href="../assets/soltec-carport-plavecky-03.jpg" fetchpriority="high">',
              '<link rel="preload" as="image" href="../assets/soltec-carport-sl240-real.jpg" fetchpriority="high">',
          )
          replace_exact(
              p,
              '<meta property="og:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-carport-plavecky-03.jpg">',
              '<meta property="og:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-carport-sl240-real.jpg">',
          )
          replace_exact(
              p,
              '<meta name="twitter:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-carport-plavecky-03.jpg">',
              '<meta name="twitter:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-carport-sl240-real.jpg">',
          )
          w, h = dims("soltec-carport-sl240-real.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-carport-toth-nitra-clean.jpg" width="2200" height="1650" alt="Hliníkový carport Soltec SL 240 pre dve autá — realizácia Nitra" fetchpriority="high" decoding="async">',
              f'<img src="../assets/soltec-carport-sl240-real.jpg" width="{w}" height="{h}" alt="Hliníkový carport Soltec SL 240 pre dve autá" title="Carport Soltec SL 240 — hliníkový prístrešok" fetchpriority="high" decoding="async">',
          )
          w, h = dims("soltec-carport-plavecky-02.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-carport-sl240-real.jpg" width="2400" height="1500" alt="Carport Soltec SL 240 s priznaným spádom" loading="lazy" decoding="async">',
              f'<img src="../assets/soltec-carport-plavecky-02.jpg" width="{w}" height="{h}" alt="Carport Soltec — realizácia prístrešku pre auto z iného pohľadu" title="Carport Soltec — realizácia" loading="lazy" decoding="async">',
          )
          w, h = dims("soltec-roof-iso.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-roof-glass.jpg" width="1600" height="1132" alt="Sklenená výplň strechy" decoding="async" loading="lazy">',
              f'<img src="../assets/soltec-roof-iso.jpg" width="{w}" height="{h}" alt="ISO panel strechy hliníkového carportu Soltec" title="Strecha carportu Soltec — ISO panel 30 mm" decoding="async" loading="lazy">',
          )

          p = "pevne-prestresenia/index.html"
          w, h = dims("soltec-pevne-prestresenie-mokrance.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-canopy-hero.jpg" width="2400" height="1470" alt="Prístrešok s pevnou strechou nad terasou" loading="lazy" decoding="async">',
              f'<img src="../assets/soltec-pevne-prestresenie-mokrance.jpg" width="{w}" height="{h}" alt="Pevné hliníkové prestrešenie Soltec pri rodinnom dome v Mokranciach" title="Pevné prestrešenie Soltec — Mokrance" loading="lazy" decoding="async">',
          )

          p = "bioklimaticke-pergoly/index.html"
          w, h = dims("soltec-accessory-walls.jpg")
          replace_exact(
              p,
              '<img width="1656" height="1190" src="../assets/soltec-bio-winter-2024.jpg" alt="Bočné uzavretie pergoly Soltec v zimnej realizácii" loading="lazy" decoding="async">',
              f'<img src="../assets/soltec-accessory-walls.jpg" width="{w}" height="{h}" alt="Pevné bočné steny bioklimatickej pergoly Soltec" title="Bočné steny pergoly Soltec" loading="lazy" decoding="async">',
          )
          w, h = dims("soltec-bioklimaticka-pergola-limbach.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-bio-vecer-led.jpg" alt="Bioklimatická pergola s LED osvetlením večer" width="1600" height="960" loading="lazy" decoding="async">',
              f'<img src="../assets/soltec-bioklimaticka-pergola-limbach.jpg" alt="Bioklimatická pergola Soltec pri rodinnom dome v Limbachu" title="Bioklimatická pergola Soltec — realizácia Limbach" width="{w}" height="{h}" loading="lazy" decoding="async">',
          )
          w, h = dims("soltec-bioklimaticka-pergola-limbach-detail.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-bio-fall-2024.jpg" width="1656" height="1190" alt="Pergola v daždi" decoding="async" loading="lazy">',
              f'<img src="../assets/soltec-bioklimaticka-pergola-limbach-detail.jpg" width="{w}" height="{h}" alt="Detail rámu, lamiel a stĺpa bioklimatickej pergoly Soltec v Limbachu" title="Detail konštrukcie pergoly Soltec — Limbach" decoding="async" loading="lazy">',
          )
          w, h = dims("soltec-bioklimaticka-pergola-zilinska-lehota.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-bio-render-15.jpg" width="1600" height="960" alt="Bioklimatická pergola Soltec pri modernom dome" loading="lazy" decoding="async" title="Bioklimatická pergola Soltec — svetlé vyhotovenie">',
              f'<img src="../assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg" width="{w}" height="{h}" alt="Bioklimatická pergola Soltec pri rodinnom dome v Žilinskej Lehote" title="Bioklimatická pergola Soltec — Žilinská Lehota" loading="lazy" decoding="async">',
          )
          replace_exact(
              p,
              '<p class="k-copy">Pergola s LED osvetlením po zotmení</p>',
              '<p class="k-copy">Realizácia bioklimatickej pergoly v Žilinskej Lehote</p>',
          )
          w, h = dims("soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg")
          replace_exact(
              p,
              '<img src="../assets/soltec-bio-winery-2026.jpg" width="1920" height="1280" alt="Pergola nad sedením pri vinárstve" loading="lazy" decoding="async">',
              f'<img src="../assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg" width="{w}" height="{h}" alt="Bioklimatická pergola Soltec pri rodinnom dome v Hliníku nad Hronom" title="Bioklimatická pergola Soltec — Hliník nad Hronom" loading="lazy" decoding="async">',
          )
          replace_exact(
              p,
              '<p class="k-copy">Pergola nad sedením pri vinárstve</p>',
              '<p class="k-copy">Realizácia bioklimatickej pergoly v Hliníku nad Hronom</p>',
          )

          p = "tienenie/index.html"
          replace_exact(
              p,
              '<link rel="preload" as="image" href="https://koverta.sk/cdn/shop/files/20250522_144820.jpg?width=1800" fetchpriority="high">',
              '<link rel="preload" as="image" href="../assets/soltec-tienenie-lamely-velka-luka.jpg" fetchpriority="high">',
          )
          replace_exact(
              p,
              '<meta property="og:image" content="https://koverta.sk/cdn/shop/files/20250522_144820.jpg?width=1200">',
              '<meta property="og:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-tienenie-lamely-velka-luka.jpg">',
          )
          replace_exact(
              p,
              '<meta name="twitter:image" content="https://koverta.sk/cdn/shop/files/20250522_144820.jpg?width=1200">',
              '<meta name="twitter:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-tienenie-lamely-velka-luka.jpg">',
          )

          p = "outdoor-kuchyne/index.html"
          replace_exact(
              p,
              '<link rel="preload" as="image" href="../assets/soltec-kuchyna-pergola.jpg" fetchpriority="high">',
              '<link rel="preload" as="image" href="../assets/soltec-outdoor-kuchyna-graz.jpg" fetchpriority="high">',
          )
          replace_exact(
              p,
              '<meta property="og:image" content="https://koverta.sk/cdn/shop/files/Graz_Showroom_horizontal_1.png?width=1200">',
              '<meta property="og:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-outdoor-kuchyna-graz.jpg">',
          )
          replace_exact(
              p,
              '<meta name="twitter:image" content="https://koverta.sk/cdn/shop/files/Graz_Showroom_horizontal_1.png?width=1200">',
              '<meta name="twitter:image" content="https://danielvendzur-code.github.io/koverta-web/assets/soltec-outdoor-kuchyna-graz.jpg">',
          )

          local_ref = re.compile(r'(?:src|href)="\.\./assets/([^"?#]+)')
          photo_src = re.compile(
              r'<img\b[^>]*\bsrc="\.\./assets/([^"?#]+\.(?:jpe?g|png|webp))"',
              re.I,
          )
          for html in sorted(html_files):
              text = Path(html).read_text(encoding="utf-8")
              for rel in local_ref.findall(text):
                  asset = Path("assets") / rel
                  if not asset.is_file():
                      raise SystemExit(f"{html}: broken local asset reference: {asset}")

              start = text.find('<main class="k"')
              end = text.rfind('</main>')
              if start < 0 or end < start:
                  raise SystemExit(f"{html}: cannot isolate main content")
              main = text[start:end]
              photos = photo_src.findall(main)
              duplicates = sorted({src for src in photos if photos.count(src) > 2})
              if duplicates:
                  raise SystemExit(
                      f"{html}: photo used 3+ times in main content: {duplicates}"
                  )

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != allowed_changes:
              raise SystemExit(
                  f"Unexpected changed files. Expected {sorted(allowed_changes)}, got {sorted(changed)}"
              )
          PY

          git diff --check

      - name: Commit only the verified photo-scope changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            pristresky-pre-auta/index.html \
            zahradne-pristresky/index.html \
            carport-soltec/index.html \
            pevne-prestresenia/index.html \
            bioklimaticke-pergoly/index.html \
            tienenie/index.html \
            outdoor-kuchyne/index.html \
            assets/soltec-bioklimaticka-pergola-limbach-detail.jpg \
            assets/soltec-bioklimaticka-pergola-hlinik-nad-hronom.jpg \
            assets/soltec-bioklimaticka-pergola-zilinska-lehota.jpg
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --check
          git commit -m 'fix: curate Koverta and Soltec photography'
          git push origin HEAD:fix/koverta-final-repair-20260910