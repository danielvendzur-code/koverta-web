name: Final site audit rerun 20260911

on:
  push:
    branches: [fix/koverta-final-repair-20260910]
    paths: [.github/workflows/tmp-final-site-audit-rerun-20260911.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply remaining carport gallery correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('carport-soltec/index.html')
          s=p.read_text(encoding='utf-8')
          old='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-canopy-f170-real.jpg" width="2000" height="1239" alt="SL 170 pre jedno auto" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">SL 170 pre jedno auto</p></div></article>'''
          new='''<article class="kh-cat__item k-reveal" data-k-delay="2"><div class="kh-cat__media"><img src="../assets/soltec-carport-plavecky-03.jpg" alt="Hliníkový carport Soltec s otvoreným státím pri rodinnom dome" loading="lazy" decoding="async"></div><div class="kh-cat__body"><p class="k-copy">Carport Soltec s otvoreným státím</p></div></article>'''
          if old in s:
              if s.count(old)!=1: raise SystemExit('ambiguous carport gallery anchor')
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('neither old nor corrected carport gallery card found')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import posixpath
          html=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          bad=[]
          class P(HTMLParser):
              def __init__(self,f): super().__init__(); self.f=f
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for k in ('src','href'):
                      raw=d.get(k)
                      if not raw or raw.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')): continue
                      if tag=='a' and k=='href': continue
                      val=unquote(urlsplit(raw).path)
                      if not val: continue
                      t=Path('.'+val) if val.startswith('/') else self.f.parent/val
                      t=Path(posixpath.normpath(str(t)))
                      if (t.suffix or tag in ('img','script','link','source','video')) and not t.exists(): bad.append((str(self.f),tag,raw,str(t)))
          for f in html:
              q=P(f); q.feed(f.read_text(encoding='utf-8'))
          if bad:
              print('\n'.join(map(str,bad[:100]))); raise SystemExit('broken local asset references')
          car=Path('carport-soltec/index.html').read_text(encoding='utf-8')
          a=car.index('class="kh-cat__grid"'); b=car.index('</section>',a); gallery=car[a:b]
          assert 'soltec-canopy-f170-real.jpg' not in gallery
          assert 'SL 170 pre jedno auto' not in gallery
          a=car.index('id="modely-carport"'); b=car.index('</section>',a); models=car[a:b]
          assert 'soltec-carport-f240-real.jpg' not in models
          for x in ('SL 170','SL 240','3,14 m','8,0 m','6,0 m','8,5 m','ISO panel 30 mm'): assert x in models,x
          can=Path('pevne-prestresenia/index.html').read_text(encoding='utf-8')
          for x in ('F170','F240','G170','G240'): assert x in can,x
          assert Path('index.html').read_text(encoding='utf-8').count('data-k-step>')==5
          assert Path('bioklimaticke-pergoly/index.html').read_text(encoding='utf-8').count('class="kh-odtien"')==8
          print('static audit OK:',len(html),'HTML files')
          PY
          node --check assets/koverta-2026.js
          node --check konfigurator/soltec-premium.js
          node --check konfigurator/koverta-cfg-enhance.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-site-pw qa-final-site-rerun
          cd /tmp/final-site-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.58.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Browser audit and clean visual evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8913 >/tmp/final-site2-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8913/ >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-site-pw/node_modules
          node - <<'JS'
          const {chromium}=require('playwright');
          const path=require('path'),proc=require('node:process');
          const routes=[['home','/'],['cars','/pristresky-pre-auta/'],['garden','/zahradne-pristresky/'],['carport','/carport-soltec/'],['bio','/bioklimaticke-pergoly/'],['canopy','/pevne-prestresenia/'],['shade','/tienenie/'],['kitchen','/outdoor-kuchyne/'],['realizations','/realizacie/'],['cfg-koverta','/konfigurator/?page=koverta'],['cfg-carport','/konfigurator/?page=carport'],['cfg-canopy','/konfigurator/?page=canopy'],['cfg-bio','/konfigurator/?page=bio']];
          const shotSel={home:'[data-k-process]',carport:'#modely-carport',canopy:'#typy-prestresenia',bio:'section.kh-farby'};
          (async()=>{
            const b=await chromium.launch({headless:true});
            for(const vp of [{w:1440,h:1000,n:'desktop'},{w:390,h:844,n:'mobile'}]) for(const [name,url] of routes){
              const c=await b.newContext({viewport:{width:vp.w,height:vp.h}}),page=await c.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',r=>{const u=new URL(r.request().url());return (u.hostname==='127.0.0.1'||u.hostname==='localhost')?r.continue():r.abort()});
              const resp=await page.goto('http://127.0.0.1:8913'+url,{waitUntil:'domcontentloaded',timeout:30000});
              if(!resp||!resp.ok()) throw new Error(`${name}/${vp.n}: HTTP ${resp&&resp.status()}`);
              await page.waitForTimeout(400);
              const ov=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(ov>2) throw new Error(`${name}/${vp.n}: overflow ${ov}`);
              const srcs=await page.locator('img[src]').evaluateAll(xs=>[...new Set(xs.map(x=>x.getAttribute('src')).filter(s=>s&&!/^https?:|^data:/.test(s)))]);
              for(const src of srcs){const r=await c.request.get(new URL(src,page.url()).href,{timeout:15000});if(!r.ok())throw new Error(`${name}: image ${src} ${r.status()}`)}
              if(errors.length) throw new Error(`${name}/${vp.n}: ${errors.join(' | ')}`);
              if(name==='home'&&await page.locator('[data-k-process] [data-k-step]').count()!==5) throw new Error('home process != 5');
              if(name==='carport'){
                const t=await page.locator('#modely-carport').innerText(); for(const x of ['SL 170','SL 240','ISO panel 30 mm'])if(!t.includes(x))throw new Error('carport missing '+x);
                const g=await page.locator('.kh-cat__grid').innerText(); if(g.includes('SL 170 pre jedno auto'))throw new Error('bad exact SL170 gallery label');
              }
              if(name==='canopy'){const t=await page.locator('#typy-prestresenia').innerText();for(const x of ['F170','F240','G170','G240'])if(!t.includes(x))throw new Error('canopy missing '+x)}
              if(name==='bio'&&await page.locator('section.kh-farby .kh-odtien').count()!==8)throw new Error('swatches != 8');
              if(shotSel[name]){
                const loc=page.locator(shotSel[name]); await loc.scrollIntoViewIfNeeded();
                await loc.locator('img').evaluateAll(xs=>xs.forEach(x=>x.loading='eager'));
                await page.waitForFunction(sel=>[...document.querySelectorAll(sel+' img')].every(x=>x.complete&&x.naturalWidth>0),shotSel[name],{timeout:15000}).catch(()=>{});
                await page.addStyleTag({content:`.k-rise,.k-reveal,[data-k-headline],.k-head__title,.k-copy{opacity:1!important;transform:none!important;clip-path:none!important;visibility:visible!important;animation:none!important;transition:none!important}`});
                await page.evaluate(sel=>{const target=document.querySelector(sel);for(const el of document.querySelectorAll('*')){const p=getComputedStyle(el).position;if((p==='fixed'||p==='sticky')&&target&&!target.contains(el))el.style.setProperty('display','none','important')}},shotSel[name]);
                await page.waitForTimeout(250);
                await loc.screenshot({path:path.join(proc.env.GITHUB_WORKSPACE,'qa-final-site-rerun',`${name}-${vp.n}.png`)});
              }
              await c.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Core configurator regression suite
        shell: bash
        env:
          KV_URL: http://127.0.0.1:8914/konfigurator/?page=koverta
        run: |
          set -euo pipefail
          python3 -m http.server 8914 >/tmp/final-cfg2-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS 'http://127.0.0.1:8914/konfigurator/?page=koverta' >/dev/null && break; sleep 1; done
          export NODE_PATH=/tmp/final-site-pw/node_modules
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          for t in pricing-logic osnova-podla-expivi technical-fidelity layout-smoke routing-smoke browser-qa; do
            echo "=== $t ==="
            node "konfigurator/test/$t.js"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-site-rerun-${{ github.sha }}
          path: qa-final-site-rerun/*.png
          if-no-files-found: error

      - name: Commit correction and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- carport-soltec/index.html; then
            git add carport-soltec/index.html
            git commit -m 'fix: remove misleading SL170 gallery claim'
          fi
          git rm -f .github/workflows/tmp-final-site-audit-20260911.yml .github/workflows/tmp-final-site-audit-rerun-20260911.yml
          git commit -m 'ci: remove temporary final site audits'
          git push origin HEAD:fix/koverta-final-repair-20260910
