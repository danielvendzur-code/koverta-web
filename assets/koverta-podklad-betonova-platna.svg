<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d">
<title id="t">Kotvenie do betónovej platne</title><desc id="d">Technický rez: oceľový stĺp 100 × 100 mm na teleskopickej pätke, kotvený do súvislej betónovej platne.</desc>
<defs>
  <pattern id="beton" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#e6e3dc"/><path d="M0 0v9" stroke="#c7c2b7" stroke-width="1.1"/>
  </pattern>
  <pattern id="zemina" width="26" height="14" patternUnits="userSpaceOnUse">
    <path d="M3 11h5M14 5h6M8 3h3M19 12h4" stroke="#c3bdb0" stroke-width="2" stroke-linecap="round"/>
  </pattern>
  <linearGradient id="ocel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2b3238"/><stop offset=".45" stop-color="#454e55"/><stop offset="1" stop-color="#232a30"/>
  </linearGradient>
</defs>
<rect width="860" height="520" rx="22" fill="#f7f6f3"/>

<!-- terén -->
<rect x="0" y="392" width="860" height="128" fill="url(#zemina)" opacity=".75"/>
<path d="M0 392h860" stroke="#b4ada0" stroke-width="2.5"/>

<g stroke="#12171a" stroke-width="3">
  <rect x="60" y="392" width="740" height="84" rx="2" fill="url(#beton)"/>
</g>
<g stroke="#8d95a0" stroke-width="2.5" fill="none" stroke-dasharray="7 9">
  <path d="M60 440h740"/>
</g>
<g stroke="#FFCC00" stroke-width="3.5" fill="none" stroke-linecap="round">
  <path d="M812 392v84"/><path d="M800 392h24M800 476h24"/>
</g>

<!-- stĺp -->
<rect x="398" y="96" width="64" height="266" rx="3" fill="url(#ocel)"/>
<path d="M398 96h64v266h-64z" fill="none" stroke="#12171a" stroke-width="3"/>
<path d="M414 96v266" stroke="#5c666e" stroke-width="1.5" opacity=".8"/>
<!-- teleskopická pätka -->
<rect x="386" y="362" width="88" height="16" rx="2" fill="#5a636a" stroke="#12171a" stroke-width="3"/>
<rect x="352" y="378" width="156" height="15" rx="2" fill="#6b747b" stroke="#12171a" stroke-width="3"/>
<circle cx="372" cy="386" r="4" fill="#12171a"/><circle cx="488" cy="386" r="4" fill="#12171a"/>

<!-- kóty -->
<g stroke="#FFCC00" stroke-width="3.5" fill="none" stroke-linecap="round">
  <path d="M398 62h64"/><path d="M398 52v20M462 52v20"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#12171a">
  <text x="430" y="42" font-size="21" text-anchor="middle" font-weight="700">100 mm</text>
  <text x="528" y="330" font-size="18" fill="#5d666c">teleskopická pätka</text>
  <text x="528" y="354" font-size="18" fill="#5d666c">platňa 15 mm</text>
  <path d="M524 346 L474 378" stroke="#9aa2a8" stroke-width="2" fill="none"/>
</g>
</svg>
