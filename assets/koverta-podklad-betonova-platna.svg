<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d">
<title id="t">Kotvenie do betónovej platne</title><desc id="d">Technický rez: súvislá betónová platňa pod celým prístreškom, stĺpy sú do nej kotvené zvrchu. Pod platňou je štrkové lôžko.</desc>
<defs>
