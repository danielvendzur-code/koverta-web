<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d">
<title id="t">Kotvenie do betónovej platne</title><desc id="d">Technický rez: súvislá betónová platňa pod celým prístreškom, stĺpy sú do nej kotvené zvrchu. Pod platňou je štrkové lôžko.</desc>
<defs>
  <pattern id="beton" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#e6e3dc"/><path d="M0 0v9" stroke="#c7c2b7" stroke-width="1.1"/>
  </pattern>
  <pattern id="zemina" width="26" height="14" patternUnits="userSpaceOnUse">
    <path d="M3 11h5M14 5h6M8 3h3M19 12h4" stroke="#c3bdb0" stroke-width="2" stroke-linecap="round"/>
  </pattern>
  <pattern id="stierk" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#ded9cf"/><circle cx="3" cy="3" r="1.6" fill="#bdb6a8"/><circle cx="8" cy="7" r="1.9" fill="#bdb6a8"/>
  </pattern>
  <!-- Stĺp je hranatý oceľový profil, nie rúra. Dva ploché odtiene s tvrdým
       zlomom presne na hrane profilu: vľavo užšia odvrátená stena, vpravo
       čelná. Plynulý prechod by z neho spravil valec. Antracit RAL 7016. -->
  <linearGradient id="ocel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4b545a"/><stop offset=".25" stop-color="#4b545a"/>
    <stop offset=".25" stop-color="#383e42"/><stop offset="1" stop-color="#383e42"/>
  </linearGradient>
  <!-- Pätná platňa je žiarovo pozinkovaná, teda strieborná, nie sivomodrá. -->
  <linearGradient id="zinok" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e2e6e8"/><stop offset=".45" stop-color="#c4cacd"/>
    <stop offset="1" stop-color="#a7aeb2"/>
  </linearGradient>
</defs>
<rect width="860" height="520" rx="22" fill="#f7f6f3"/>

<rect x="0" y="392" width="860" height="128" fill="url(#zemina)" opacity=".75"/>
<path d="M0 392h860" stroke="#b4ada0" stroke-width="2.5"/>
<rect x="40" y="392" width="780" height="46" fill="url(#stierk)" stroke="#c7c2b7" stroke-width="2"/>
<rect x="40" y="330" width="780" height="62" rx="2" fill="url(#beton)" stroke="#12171a" stroke-width="3"/>

<rect x="168" y="96" width="64" height="204" rx="3" fill="url(#ocel)"/>
<path d="M168 96h64v204h-64z" fill="none" stroke="#12171a" stroke-width="3"/>
<path d="M184 96v204" stroke="#2a3035" stroke-width="2"/>
<rect x="156" y="300" width="88" height="16" rx="2" fill="url(#zinok)" stroke="#12171a" stroke-width="3"/>
<rect x="122" y="316" width="156" height="15" rx="2" fill="url(#zinok)" stroke="#12171a" stroke-width="3"/>
<circle cx="142" cy="324" r="4.5" fill="#8f979c" stroke="#12171a" stroke-width="1.6"/><circle cx="258" cy="324" r="4.5" fill="#8f979c" stroke="#12171a" stroke-width="1.6"/>
<rect x="474" y="96" width="64" height="204" rx="3" fill="url(#ocel)"/>
<path d="M474 96h64v204h-64z" fill="none" stroke="#12171a" stroke-width="3"/>
<path d="M490 96v204" stroke="#2a3035" stroke-width="2"/>
<rect x="462" y="300" width="88" height="16" rx="2" fill="url(#zinok)" stroke="#12171a" stroke-width="3"/>
<rect x="428" y="316" width="156" height="15" rx="2" fill="url(#zinok)" stroke="#12171a" stroke-width="3"/>
<circle cx="448" cy="324" r="4.5" fill="#8f979c" stroke="#12171a" stroke-width="1.6"/><circle cx="564" cy="324" r="4.5" fill="#8f979c" stroke="#12171a" stroke-width="1.6"/>
<g stroke="#FFCC00" stroke-width="3.5" fill="none" stroke-linecap="round">
  <path d="M790 330v62"/><path d="M778 330h24M778 392h24"/>
</g>
<text x="404" y="370" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#12171a" text-anchor="middle" font-weight="700">súvislá platňa pod celým prístreškom</text>
<text x="404" y="424" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5d666c" text-anchor="middle">štrkové lôžko</text>

</svg>
